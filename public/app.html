<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D4DC7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZAPLUG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AZAPLUG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Brand tokens (AZAPLUG Brand Guidelines v1.0) ---------- */
:root{
  --blue:#0D4DC7; --blue-dark:#0A3FA6; --slate:#111827; --bg:#F4F7FC;
  --green:#10B981; --orange:#F59E0B; --red:#EF4444;
  --muted:#6B7280; --soft:#9CA3AF; --line:#E3E8F1; --card:#fff;
  --head:'Outfit',system-ui,sans-serif; --body:'Geist','Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --r-card:24px; --r-field:12px; --m:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E6EAF2;font-family:var(--body);color:var(--slate);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:402px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.screen{min-height:100dvh;padding:28px var(--m) 40px;display:flex;flex-direction:column}
.screen.tabs{padding-bottom:130px}
.screen.white{background:#fff}
.screen.blue{background:var(--blue);color:#fff}
h1,h2,h3,.h{font-family:var(--head);letter-spacing:-.01em}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:999px;background:var(--blue);color:#fff;font-family:var(--head);font-weight:700;font-size:17px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985);background:var(--blue-dark)}
.btn.sq{border-radius:16px;height:56px;box-shadow:0 10px 22px -10px rgba(13,77,199,.55)}
.btn.white{background:#fff;color:var(--blue)}
.btn.outline{background:#fff;color:var(--slate);border:1.5px solid #D9DEE8;font-family:var(--body);font-weight:500;font-size:18px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);flex:none}
.icon-btn.sqr{border-radius:12px;color:var(--slate)}
.link{color:var(--blue);font-weight:700}

/* ---------- Fields ---------- */
label.lb{display:block;font-weight:600;font-size:15px;margin:22px 0 10px}
.field{display:flex;align-items:center;gap:10px;height:58px;border:1.5px solid #E1E5EC;border-radius:var(--r-field);background:#fff;padding:0 18px}
.field:focus-within{border-color:var(--blue)}
.field input,.field select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.field input::placeholder{color:#9CA3AF}
.field select{appearance:none;-webkit-appearance:none;font-weight:600}
.field .eye{color:#4B5563}
.field.sm{height:52px}

/* ---------- Cards / badges ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-approved,.b-processing{background:#E4F6EE;color:#0E9F6E}
.b-checking{background:#FEEFC3;color:#E08A00}
.b-confirmed,.b-compensation,.b-draft,.b-live{background:#EAF1FE;color:var(--blue)}
.b-failed{background:#FDE0E0;color:var(--red)}
.cap{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- Top bars ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:44px}
.top .title{font-family:var(--head);font-weight:700;font-size:20px;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.top.left .title{position:static;text-align:left;font-size:24px;margin-left:14px;flex:1}
.brand{font-family:var(--head);font-weight:800;font-size:22px;color:var(--blue);letter-spacing:0}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(min(402px,100vw) - 40px);height:76px;background:var(--blue);border-radius:38px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 14px 30px -10px rgba(13,77,199,.6);z-index:20}
.nav button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.72);font-size:11.5px;font-weight:500;flex:1 1 0;min-width:0}
.nav button.on{color:#fff;font-weight:700}
.nav svg.i{width:23px;height:23px}
.fab{position:fixed;bottom:108px;right:calc(50% - min(201px,50vw) + 22px);width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(13,77,199,.7);z-index:21}
.fab.low{bottom:28px}

/* ---------- Segments ---------- */
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}

/* ---------- Auth ---------- */
.logo-dot{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto}
.logo-dot svg.i{width:40px;height:40px;stroke-width:1.6}
.logo-dot.sm{width:64px;height:64px}.logo-dot.sm svg.i{width:26px;height:26px;stroke-width:2}
.wordmark{font-family:var(--head);font-weight:800;font-size:36px;text-align:center}
.role{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);text-align:left;margin-top:14px;color:#fff}
.role .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.role b{font-family:var(--head);font-size:19px;font-weight:700;display:block}
.role span{font-size:14px;opacity:.8}
.role.on{background:#fff;color:var(--blue);box-shadow:0 12px 26px -10px rgba(0,0,0,.35)}
.role.on .ic{background:#EEF2FB}
.role .chev{margin-left:auto;opacity:.7}
.auth h1{font-size:32px;font-weight:800;line-height:1.15}
.auth .sub{color:#4B5563;font-size:16px;margin-top:10px}
.or{display:flex;align-items:center;gap:20px;color:var(--muted);margin:22px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:#E1E5EC}
.finger{width:180px;height:180px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#F5F7FD;border:1px solid #E1E7F5}
.finger i{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:#E7ECF9;border:1px solid #D2DBF2}
.finger b{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 10px 22px -6px rgba(13,77,199,.6)}
.finger svg.i{width:44px;height:44px;stroke-width:1.5}

/* ---------- Home ---------- */
.balance{background:var(--blue);color:#fff;border-radius:28px;padding:22px 20px 20px;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.balance small{font-size:13px;opacity:.85}
.balance .amt{font-family:var(--head);font-weight:800;font-size:36px;line-height:1.2;margin:4px 0 16px}
.pills{display:flex;gap:8px}
.pills button{flex:1;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;padding:0;min-width:0}
.pills button:first-child{font-size:11px;flex:1.1}
.pills button.on{background:#fff;color:var(--blue);border-color:#fff}
.txn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}
.txn .nm{font-family:var(--head);font-weight:600;font-size:16.5px}
.txn .dt{font-size:12px;color:var(--soft);margin-top:2px}
.txn .rt{margin-left:auto;text-align:right}
.txn .am{font-family:var(--head);font-weight:700;font-size:16.5px;margin-bottom:4px}
.flag{width:40px;height:40px;border-radius:50%;background:#EEF1F6;display:grid;place-items:center;font-size:24px;line-height:1;overflow:hidden;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 4px}
.sec-h h3{font-size:17px;font-weight:600}

/* ---------- Get account ---------- */
.acct .mono{font-family:var(--mono);font-weight:700;font-size:13px;margin-top:12px}
.noimg{height:100px;border-radius:14px;background:#EEF2F8;border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:8px;color:#9AA3B5;font-family:var(--mono);font-size:13px;margin-top:14px}
.noimg svg.i{width:26px;height:26px}
.copy{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--slate);background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:0 2px 0 rgba(17,24,39,.15)}
.kv{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;padding:7px 14px;font-size:13px;border-top:1px solid #EEF1F6}
.kv div:first-child{border-top:0}
.kv b{font-family:var(--mono);font-weight:700}
.kv span{color:var(--muted)}

/* ---------- Summary rows ---------- */
.sum div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.sum span{color:#4B5563}
.sum b{font-family:var(--head);font-weight:700;font-size:17px}
.sum.plain b{font-family:var(--body);font-weight:500;font-size:15px}
.hr,.sum div.hr{height:1px;background:var(--line);margin:8px 0;padding:0}
.ok-ring{width:104px;height:104px;border-radius:50%;background:#E3EAF8;display:grid;place-items:center;margin:8px auto 18px}
.ok-ring i{width:80px;height:80px;border-radius:50%;background:#C9D6F3;display:grid;place-items:center}
.ok-ring b{width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.ok-ring svg.i{width:28px;height:28px}
.upload{display:grid;place-items:center;align-content:center;gap:10px;height:106px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--soft);cursor:pointer;width:100%}
.upload span.c{width:36px;height:36px;border-radius:50%;background:#F1F4F9;border:1px solid var(--line);display:grid;place-items:center;color:#4B5563}

/* ---------- Crypto ---------- */
.toggle2{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.toggle2 button{padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.toggle2 button.on{background:var(--blue);color:#fff}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.coin svg.i{width:18px;height:18px}
.big{font-family:var(--head);font-weight:800;font-size:32px;margin-top:16px}
.qr{width:200px;height:200px;margin:26px auto 18px;position:relative}

/* ---------- Chat ---------- */
.chat{padding:0;background:#E8EEF8;min-height:100dvh;display:flex;flex-direction:column}
.chat-top{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700;position:relative;flex:none}
.avatar:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.msgs{flex:1;padding:18px 16px 110px;display:flex;flex-direction:column;gap:20px}
.day{align-self:center;background:#DDE3EE;color:#6B7280;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.03em}
.msg{max-width:80%;padding:12px 15px 9px;border-radius:18px;font-size:15px;line-height:1.45;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.msg.in{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.msg.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{display:block;color:var(--blue);font-weight:700;font-size:13px;margin-bottom:3px}
.msg time{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:3px}
.voice{display:flex;align-items:center;gap:10px}
.voice .pl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.voice .pl svg.i{width:15px;height:15px;stroke-width:2.5}
.msg.in .pl{background:var(--blue);color:#fff}.msg.out .pl{background:#fff;color:var(--blue)}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;border-radius:2px;background:currentColor;opacity:.9}
.msg.in .wave{color:var(--blue)}
.shot{height:150px;border-radius:14px;background:linear-gradient(135deg,#C6D8DE,#E9F0F3);display:grid;place-items:center;color:#5B6B7A;font-size:12px;margin-bottom:8px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(402px,100vw);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.composer .inp{flex:1;min-width:0;display:flex;align-items:center;height:42px;border-radius:999px;background:#F1F3F7;padding:0 14px;color:#6B7280}
.composer input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.composer .rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#F1F3F7;color:#6B7280;flex:none}
.composer .rb.send{background:var(--blue);color:#fff;box-shadow:0 6px 14px -4px rgba(13,77,199,.6)}

/* ---------- Profile ---------- */
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.hero .ph{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;margin:0 auto 14px;font-family:var(--head);font-weight:700;font-size:30px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.info span{color:var(--muted)}.info b{font-weight:600;text-align:right;word-break:break-word}
.pref{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.pref b{font-family:var(--head);font-weight:600;display:block}.pref small{color:var(--muted);font-size:12.5px}
.sw{width:46px;height:26px;border-radius:999px;background:#D5D9E2;position:relative;transition:.15s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on:after{left:23px}
.menu{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;font-family:var(--head);font-weight:600;font-size:15.5px;text-align:left}
.menu .ic{width:36px;height:36px;border-radius:50%;background:#EEF2FB;color:var(--blue);display:grid;place-items:center}
.menu .chev{margin-left:auto;color:var(--soft)}
.menu.danger{color:var(--red)}.menu.danger .ic{background:#FDE0E0;color:var(--red)}.menu.danger .chev{color:var(--red)}

/* ---------- Notifications / rules / loan ---------- */
.note{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.note.unread{border:1.5px solid var(--blue)}
.note .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.note h4{font-family:var(--head);font-weight:600;font-size:15.5px}
.note p{font-size:13px;color:var(--muted);margin-top:4px}
.note .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:middle}
.rules p{font-weight:500;font-size:14.5px;margin-bottom:18px;line-height:1.35}
.warn{display:flex;gap:14px;align-items:center;background:#FEF9E6;border:1px solid #F8DE8B;border-radius:18px;padding:16px;color:#B45309}
.warn b{font-family:var(--head);display:block}.warn p{font-size:13px}
.tile{border-radius:16px;padding:16px;margin-top:14px}
.banner{display:flex;align-items:center;gap:10px;background:#E6ECF9;color:var(--blue);font-weight:600;border-radius:12px;padding:12px 14px;margin-bottom:22px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:50;max-width:340px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--soft);padding:40px 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.blue :focus-visible{outline-color:#fff}
.btn:disabled{opacity:.5}
a.role{display:flex}
.tx-b{width:100%;text-align:left}
.steps{display:flex;margin-top:20px}.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--soft);position:relative;font-weight:600}
.steps i{display:block;width:14px;height:14px;border-radius:50%;background:#D5DBE6;margin:0 auto 8px;position:relative;z-index:1}
.steps div:not(:first-child):before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:#D5DBE6}
.steps .on{color:var(--blue)}.steps .on i,.steps .on:before{background:var(--blue)!important}
.ndot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.steps2{text-align:left;margin:22px 8px 0;padding-left:22px;font-size:15px;line-height:1.5;color:#374151}.steps2 li{margin-bottom:8px}
.chat{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(402px,100vw);height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.chat .chat-top,.chat>.hd,.chat .esc{position:static!important;flex:none}
.chat .msgs{flex:1;min-height:0;overflow-y:auto;padding-bottom:18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chat .composer{position:static;transform:none;width:100%;flex:none}
/* Voice notes */
.voice{min-width:214px;padding:2px 0 1px}
.voice .pl{cursor:pointer;transition:transform .12s}.voice .pl:active{transform:scale(.92)}
.voice .wave{flex:1;height:28px;gap:2px;cursor:pointer}
.voice .wave i{flex:1;max-width:3px;min-height:3px;opacity:.38;transition:opacity .12s}.voice .wave i.on{opacity:1}
.voice .dur{font:500 12px var(--mono);opacity:.85;min-width:32px;text-align:right}
.composer:not(.typing)>.tx{display:none}.composer.typing>.mic{display:none}
.composer .rb.mic{background:var(--blue);color:#fff;box-shadow:0 6px 14px -4px rgba(13,77,199,.6)}
.composer.rec>label,.composer.rec>.inp,.composer.rec>button{display:none}
.recbar{display:flex;align-items:center;gap:10px;width:100%}
.recbar .del{color:var(--red);background:#FEF2F2}
.recmid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:42px;border-radius:999px;background:#FEF2F2;padding:0 14px;overflow:hidden}
.recmid b{font:600 14px var(--mono);color:var(--slate);flex:none}
.recmid .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;animation:recp 1s ease-in-out infinite}
.recmid .wave{flex:1;min-width:0;justify-content:flex-end;overflow:hidden;color:var(--red);height:24px}
.recmid .wave i{flex:none}
@keyframes recp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recmid .dot{animation:none}}
.cfm{position:fixed;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:center;z-index:99;padding:24px}

const I=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${s}>${P[n]}</svg>`;

/* =====================================================================
   AZAPLUG Customer App — connected to the Express API in server.js
   Nothing financial is decided here: balances, statuses and credited
   amounts are only ever read from the server.
   ===================================================================== */

/* Wallet details shown on the Bitcoin / USDT tab.
   Kenneth: paste your receiving addresses and fixed naira rates here.
   Leave a value empty and the app shows "not set yet" instead. */
const CRYPTO = {
  BTC:  {name:'Bitcoin', pair:'BTC / NGN',  color:'#F7931A', network:'Bitcoin (BTC)', label:'Bitcoin',       address:'1EUBJeXCb5kkT8HuVh15uBuWy9PcqEoffN', rate:null},
  USDT: {name:'Tether',  pair:'USDT / NGN', color:'#26A17B', network:'Ethereum (ERC-20)', label:'ERC-20 Tether', address:'0x4a44da73ea4c4a71125129c22100c84888b348f2', rate:null}
};

/* ---------- State + helpers ---------- */
const S={route:'loading',loan:null,notes:[],noteTab:'all',push:'off',seenSnap:0,homeTab:'trades',histTab:'All',coin:'BTC',me:null,accounts:[],trades:[],withdrawals:[],rules:null,chat:[],
  slip:null,wd:null,send:{title:'',accountId:'',amount:'',image:null}};
const $=s=>document.querySelector(s);
const amt=n=>Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const n0=n=>Number(n||0).toLocaleString('en-NG');
const naira=n=>'₦'+amt(n), naira0=n=>'₦'+n0(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=s=>/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+$/i.test(s||'')?s:'';
const fd=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const ft=d=>d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const num=v=>parseFloat(String(v).replace(/[^0-9.]/g,''))||0;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&S.me){S.me=null;go('login')}
  if(!r.ok)throw new Error(d.error||'Something went wrong. Try again.');
  return d;
}
async function loadMe(){const d=await api('GET','/api/me');S.me=d.loggedIn?d:null;return S.me}
async function loadAll(){
  const [a,t,w]=await Promise.all([api('GET','/api/accounts'),api('GET','/api/trades'),api('GET','/api/withdrawals')]);
  S.accounts=a.accounts||[];S.trades=t.trades||[];S.withdrawals=w.withdrawals||[];
}
/* ---------- Notifications + push ---------- */
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const seenAt=()=>Number(ls.get('az_seen')||0), unread=()=>S.notes.filter(n=>new Date(n.createdAt)>seenAt()).length;
const agoS=d=>{const s=(Date.now()-new Date(d))/1000;return s<60?'Just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':s<604800?Math.floor(s/86400)+'d ago':fd(new Date(d))};
const bell=()=>`<button class="icon-btn" style="position:relative" data-go="notifications" aria-label="Notifications${unread()?' ('+unread()+' new)':''}">${I('bell')}${unread()?'<i class="ndot"></i>':''}</button>`;
async function loadNotes(){try{S.notes=(await api('GET','/api/notifications')).notifications||[]}catch(e){S.notes=[]}
  if(['home','crypto','notifications'].includes(S.route)&&!document.activeElement.matches('input,select'))render()}
const PUSH_OK='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const b64=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushHelp={install:'On iPhone: tap the Share button in Safari, choose "Add to Home Screen", then open AZAPLUG from your Home Screen and turn this on.',
  denied:'Notifications are blocked for AZAPLUG in your browser or phone settings. Allow them there, then come back.',unsupported:'This browser does not support push notifications.'};
async function pushState(){
  if(!PUSH_OK){S.push=IOS&&!STANDALONE?'install':'unsupported';return}
  if(Notification.permission==='denied'){S.push='denied';return}
  try{const reg=await navigator.serviceWorker.register('/sw.js'),sub=await reg.pushManager.getSubscription();
    S.push=sub&&Notification.permission==='granted'?'on':'off';
    if(S.push==='on')api('POST','/api/push/subscribe',sub.toJSON()).catch(()=>{})}catch(e){S.push='unsupported'}
}
async function pushOn(){
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){S.push=perm==='denied'?'denied':'off';throw new Error('Notifications were not allowed')}
  const reg=await navigator.serviceWorker.ready,{publicKey}=await api('GET','/api/push/key');
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(publicKey)});
  await api('POST','/api/push/subscribe',sub.toJSON());S.push='on';
}
async function pushDetach(){if(!PUSH_OK)return null;const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();
  if(sub)await api('POST','/api/push/unsubscribe',{endpoint:sub.endpoint}).catch(()=>{});return sub}
async function pushOff(){const sub=await pushDetach();if(sub)await sub.unsubscribe();S.push='off'}
const allowed=()=>PUSH_OK&&Notification.permission==='granted';
const mustAllow=()=>S.push==='install'||S.push==='denied'||(S.push==='off'&&!allowed());
let pbusy=false;
async function togglePush(){if(pbusy)return;pbusy=true;
  try{if(S.push==='on'){await pushOff();toast('Push notifications turned off')}else{await pushOn();toast('Push notifications turned on')}}catch(e){toast(e.message||'Could not change notifications')}
  pbusy=false;if(S.route==='profile'||S.route==='notifications')render()}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.refresh&&S.me){loadNotes();const r=S.route;if(['home','history','trade','loan'].includes(r))Promise.all([loadMe(),loadAll(),r==='loan'?loadLoan():0]).then(()=>{if(S.route===r&&!document.activeElement.matches('input,select'))render()}).catch(()=>{})}
  if(!(e.data&&e.data.go&&S.me&&V[e.data.go]))return;if(S.route==='allow')S.after=e.data.go;else go(e.data.go)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.route==='allow'&&!pbusy)pushState().then(()=>{if(S.route!=='allow')return;mustAllow()?render():go(S.after||'home')}).catch(()=>{})});

const csGet=()=>{const c=CRYPTO[S.coin],u=num(S.cusd||'');return !c.rate?'The admin will confirm the naira amount.':u?`You get about ${naira(u*c.rate)} at $1 = ${naira(c.rate)}`:`Today's rate: $1 = ${naira(c.rate)}`};
document.addEventListener('input',e=>{if(e.target.id==='cs-a'){S.cusd=e.target.value;const p=$('#cs-get');if(p)p.textContent=csGet()}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='cs-file'&&t.files[0]){try{S.cimg=await compress(t.files[0]);render()}catch(err){toast('Could not read that photo')}}});
async function loadLoan(){try{S.loan=await api('GET','/api/loans')}catch(e){S.loan={error:e.message,loans:[],limit:0}}
  if(S.route==='loan'&&!document.activeElement.matches('input,select'))render()}
async function enter(){
  const me=await loadMe();
  if(!me)return go('splash');
  if(me.needsPin)return go('setpin');
  if(me.status!=='approved'){location.href='/pending.html';return}
  await loadAll();loadNotes();
  // Customers must turn notifications on before the dashboard. Only a browser that cannot do push at all is let through.
  await Promise.race([pushState(),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
  const h=location.hash.slice(1);S.after=h==='notifications'||h==='chat'?h:'home';
  if(S.push==='off'&&allowed())pushOn().catch(()=>{}); // already said yes on this device: just reconnect quietly
  go(mustAllow()?'allow':S.after);
}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=e=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const c=document.createElement('canvas'),k=Math.min(1,1000/img.width);c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};img.src=e.target.result};fr.readAsDataURL(file)})}

const TS={checking:['Checking','b-checking'],seen:['Seen','b-confirmed'],confirmed:['Confirmed','b-confirmed'],approved:['Approved','b-approved'],failed:['Failed','b-failed']};
const WS={pending:['Pending','b-checking'],paid:['Paid','b-approved'],rejected:['Rejected','b-failed']};
const back=(to,sq)=>`<button class="icon-btn ${sq?'sqr':''}" data-go="${to}" aria-label="Back">${I(sq?'cl':'al')}</button>`;
const nav=on=>{const c=S.coin==='USDT'?'USDT':'Bitcoin';
  return `<nav class="nav" aria-label="Main">${[['home','home','Home'],['accounts','repeat','Get Account'],['history','bars','History'],['crypto','btc',c],['profile','user','Account']]
  .map(([r,i,l])=>`<button class="${on===r?'on':''}" data-go="${r}" ${on===r?'aria-current="page"':''}>${I(i)}<span>${l}</span></button>`).join('')}</nav>`};
const fab=low=>`<button class="fab ${low?'low':''}" data-go="chat" aria-label="Chat with support">${I('chat')}</button>`;
const pw=(id,ph,ac)=>`<div class="field"><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"><button type="button" class="eye" data-act="eye" aria-label="Show password">${I('eyeoff')}</button></div>`;
const tradeCard=(t,rich)=>{const m=TS[t.status]||TS.checking,d=new Date(t.createdAt),ti=t.accountTitleUsed||'Account';
  return `<button class="txn tx-b" data-trade="${esc(t.id)}">${rich?`<div class="flag" style="font-family:var(--head);font-weight:700;font-size:16px;color:var(--blue)">${esc(ti[0].toUpperCase())}</div>`:''}
  <div style="min-width:0"><div class="nm">${esc(ti)}</div><div class="dt">${fd(d)} · ${ft(d)}</div>
  ${t.creditedAmount!=null?`<div class="dt" style="color:#0E9F6E">Credited ${naira(t.creditedAmount)}</div>`:''}
  ${t.status==='failed'&&t.failReason?`<div class="dt" style="color:var(--red)">${esc(t.failReason)}</div>`:''}</div>
  <div class="rt"><div class="am">${amt(t.intendedAmount)}</div><span class="badge ${m[1]}">${m[0]}</span></div></button>`};
const wdCard=w=>{const m=WS[w.status]||WS.pending,d=new Date(w.createdAt);
  return `<div class="txn"><div style="min-width:0"><div class="nm">${esc(w.payoutBank)}</div><div class="dt">${esc(w.payoutAccount)} · ${fd(d)}</div>
  ${w.status==='rejected'&&w.reason?`<div class="dt" style="color:var(--red)">${esc(w.reason)}</div>`:''}</div>
  <div class="rt"><div class="am">${naira(w.amount)}</div><span class="badge ${m[1]}">${m[0]}</span></div></div>`};
const tiers=a=>`${n0(a.lowestAmount)} → ${naira0(a.lowestRate)}  ·  ${n0(a.higherAmount)} → ${naira0(a.higherRate)}`;
const titles=()=>[...new Set(S.accounts.map(a=>a.title))];

role:()=>`<section class="screen blue">

login:()=>`<section class="screen white auth">

  <p class="between" style="margin:14px 0 22px;font-size:14px"><button type="button" class="link" data-ax="oldpw">${S.oldpw?'Use my PIN':'I still use my old password'}</button><button type="button" class="link" data-go="forgot">Forgot PIN?</button></p>
  <button class="btn">Login</button>
  </form>
  <div class="grow" style="min-height:60px"></div>
  <p style="text-align:center;color:#4B5563">Don't have an account? <button class="link" data-go="signup">Sign Up</button></p>
</section>`,

signup:()=>`<section class="screen white auth">
  <h1 style="margin-top:44px;font-size:34px">Create Account</h1><p class="sub">Sign up to start trading securely</p>
  <form data-form="signup" novalidate>
  <label class="lb" for="su-n">Full Name</label><div class="field"><input id="su-n" placeholder="Daniel Benson" autocomplete="name"></div>
  <label class="lb" for="su-p">Phone Number</label><div class="field"><input id="su-p" type="tel" placeholder="0801 234 5678" autocomplete="username"></div>

  <label class="lb" for="su-pw">Create a 6-digit PIN</label><div class="field"><input class="pin" id="su-pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="new-password"></div>
  <label class="lb" for="su-pw2">Type the PIN again</label><div class="field"><input class="pin" id="su-pw2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="new-password"></div>

home:()=>{const list=S.homeTab==='trades'
   ?(S.trades.length?S.trades.slice(0,5).map(t=>tradeCard(t)).join(''):'<p class="empty">No trades yet. Get an account and send your first receipt.</p>')
   :(S.withdrawals.length?S.withdrawals.slice(0,5).map(wdCard).join(''):'<p class="empty">No withdrawals yet</p>');
 return `<section class="screen tabs">
  <div class="between" style="margin-bottom:18px"><span class="brand">AZAPLUG</span>
   <span class="row" style="gap:12px"><button data-go="accounts" style="background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px">Rate</button>
   ${bell()}</span></div>
  <div class="balance"><small>Balance</small><div class="amt">${naira(S.me.balance)}</div>
   <div class="pills"><button class="on" data-go="accounts">Get Account</button><button data-go="withdraw">Withdraw</button><button data-go="rules">Rules</button><button data-go="loan">Borrow</button></div></div>
  <button class="btn sq" style="margin:16px 0 20px;font-family:var(--body);font-weight:600" data-go="send">Send Receipt</button>
  <div class="seg" role="tablist"><button class="${S.homeTab==='trades'?'on':''}" data-set="homeTab:trades">Trades</button><button class="${S.homeTab==='withdrawals'?'on':''}" data-set="homeTab:withdrawals">Withdrawals</button></div>
  <div class="sec-h"><h3>Recent Transactions</h3><button class="link" style="font-size:15px" data-go="history">See All</button></div>
  ${list}
  ${fab()}${nav('home')}</section>`},

accounts:()=>`<section class="screen tabs">
  <div class="top">${back('home')}<span class="title" style="font-family:var(--body);font-size:16px;font-weight:600">Get Account</span><span></span></div>
  <p class="muted" style="text-align:center;font-size:13.5px;margin-top:-6px">Search by country or bank to see the account, minimum, limit, and rate.</p>
  <div class="field" style="height:42px;margin:14px 0;color:var(--soft);padding:0 14px">${I('search','style="width:17px;height:17px"')}<input id="acct-q" placeholder="Search country or bank..." style="font-size:14px" aria-label="Search country or bank"></div>
  <div id="acct-list">${S.accounts.length?S.accounts.map(a=>{const img=safeImg(a.imageData);return `<article class="card acct" data-k="${esc((a.title+' '+a.bankName+' '+a.accountNumber).toLowerCase())}" style="padding:16px;margin-bottom:14px">
    <div style="font-weight:600">${esc(a.title)}</div>
    ${img?`<img src="${img}" alt="" style="width:100%;border-radius:14px;margin-top:14px;display:block">`:`<div class="noimg">${I('imgoff')}No image</div>`}
    <div class="mono" style="white-space:pre-wrap;line-height:2.1;word-break:break-word">${esc(a.accountNumber)}</div>
    <div style="font-family:var(--mono);font-size:10.5px;color:var(--soft)">:${esc(a.bankName)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="copy" data-copy="${esc(a.accountNumber)}" aria-label="Copy account details">${I('copy')}</button></div>
    <div class="kv"><div><span>Minimum</span><b>${naira0(a.minAmount)}</b></div><div><span>Limit</span><b>${naira0(a.maxAmount)}</b></div>
     <div><span style="font-family:var(--mono)">${n0(a.lowestAmount)}</span><b>${naira0(a.lowestRate)}</b></div><div><span style="font-family:var(--mono)">${n0(a.higherAmount)}</span><b>${naira0(a.higherRate)}</b></div></div></article>`}).join('')
    :'<p class="empty">No accounts available right now. Please check back soon.</p>'}</div>
  <div class="card" style="padding:16px"><div class="cap" style="font-size:12px">Instructions</div><p class="muted" style="font-size:13px;margin-top:8px">Please make sure to copy the account number exactly as shown. Use the concept label in your bank description for faster verification.</p></div>
  ${nav('accounts')}</section>`,

send:()=>{const ts=titles();if(!ts.length)return `<section class="screen"><div class="top left">${back('home',1)}<span class="title">Send Receipt</span></div><p class="empty">No accounts available right now. Please check back soon.</p></section>`;
 if(!ts.includes(S.send.title))S.send.title=ts[0];
 const opts=S.accounts.filter(a=>a.title===S.send.title);
 if(!opts.some(a=>a.id===S.send.accountId))S.send.accountId=opts[0].id;
 const a=opts.find(x=>x.id===S.send.accountId),img=safeImg(S.send.image);
 return `<section class="screen">
  <div class="top left">${back('home',1)}<span class="title">Send Receipt</span></div>
  <div class="card sum" style="margin:0 -24px;border-radius:20px;padding:16px 18px">
   <div><b style="font-family:var(--body);font-size:15px;font-weight:600">Trade summary</b><span class="badge b-draft">Draft</span></div>
   <div><span>You send</span><b id="s-send">${amt(num(S.send.amount))}</b></div><div><span>Recipient gets</span><b style="font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)">Set after review</b></div>
   <div><span>Minimum · Limit</span><b style="font-size:15px">${naira0(a.minAmount)} · ${naira0(a.maxAmount)}</b></div></div>
  <form data-form="send" novalidate>
  <label class="lb" style="margin-top:16px;font-size:14px" for="s-c">Country</label>
  <div class="field sm"><select id="s-c" style="font-family:var(--head);font-size:17px">${ts.map(t=>`<option ${t===S.send.title?'selected':''}>${esc(t)}</option>`).join('')}</select>${I('cd','style="color:#6B7280"')}</div>
  <label class="lb" style="margin-top:16px;font-size:14px" for="s-a">Amount you sent</label>
  <div class="field sm"><input id="s-a" inputmode="decimal" placeholder="Enter amount" value="${esc(S.send.amount)}"></div>
  <label class="lb" style="margin-top:16px;font-size:14px" for="s-b">Select the bank used</label>
  <div class="field sm"><select id="s-b" style="font-weight:400">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===a.id?'selected':''}>${esc(o.bankName)}</option>`).join('')}</select>${I('cd','style="color:#6B7280"')}</div>
  <label class="lb" style="margin-top:16px;font-size:14px">Exchange rate</label>
  <div class="field sm" style="justify-content:space-between;font-size:14px"><span style="white-space:pre">${tiers(a)}</span><span class="badge b-live">Live</span></div>
  <label class="lb" style="margin-top:34px;font-size:14px">Add Receipt</label>
  <label class="upload" style="${img?'height:auto;padding:10px':''}">${img?`<img src="${img}" alt="Receipt preview" style="max-width:100%;max-height:220px;border-radius:10px">`:`<span class="c">${I('camera','style="width:18px;height:18px"')}</span>`}<span>${img?'Tap to change photo':'Upload photo'}</span><input id="s-file" type="file" accept="image/*" hidden></label>
  <p style="font-size:12px;color:var(--soft);margin:12px 0">By starting, you agree to the exchange rate and fees shown.</p>
  <button class="btn sq">Start Trade</button></form></section>`},

slip:()=>{const d=S.slip,m=TS[d.status]||TS.checking;return `<section class="screen">
  <div class="top left">${back('home',1)}<span class="title" style="font-size:21px">Slip Sent</span></div>
  <div class="ok-ring" style="background:none;margin-top:20px"><b style="width:84px;height:84px;box-shadow:0 12px 26px -8px rgba(13,77,199,.5)">${I('check')}</b></div>
  <h2 style="text-align:center;font-size:25px;font-weight:700">Slip Sent Successfully</h2>

  <div class="card sum"><div><b style="font-family:var(--body);font-size:15.5px;font-weight:600;color:#374151">Transaction Details</b><span class="badge ${m[1]}">${m[0]}</span></div><div class="hr"></div>
   <div><span>You send</span><b>${amt(d.intendedAmount)}</b></div><div><span>Account</span><b>${esc(d.accountTitleUsed)}</b></div>
   <div><span>Recipient gets</span><b style="font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)">Set after review</b></div>
   <div><span>Reference ID</span><b style="font-size:15px">${esc(String(d.id).slice(0,8).toUpperCase())} <button data-copy="${esc(d.id)}" aria-label="Copy reference" style="color:var(--soft);vertical-align:-3px">${I('copy','style="width:16px;height:16px"')}</button></b></div></div>
  <div class="grow" style="min-height:40px"></div>
  <button class="btn sq" data-go="home">Back to Home</button></section>`},

trade:()=>{const t=S.trades.find(x=>x.id===S.tradeId);if(!t)return V.history();const m=TS[t.status]||TS.checking,d=new Date(t.createdAt),img=safeImg(t.receiptImage),fi=safeImg(t.failImage);
 const at=['checking','seen','confirmed','approved'].indexOf(t.status);
 return `<section class="screen">
  <div class="top left">${back(S.tprev||'home',1)}<span class="title" style="font-size:21px">Transaction Details</span></div>
  <div class="card"><div class="between" style="align-items:flex-start"><span><small class="muted">You sent</small><b class="h" style="display:block;font-size:30px;line-height:1.2">${amt(t.intendedAmount)}</b></span><span class="badge ${m[1]}">${m[0]}</span></div>
   ${t.status==='failed'?`<p style="margin-top:16px;background:#FDE8E8;color:#B91C1C;border-radius:12px;padding:12px 14px;font-size:14px"><b>This trade failed.</b>${t.failReason?'<br>'+esc(t.failReason):''}</p>`
   :`<div class="steps">${['Checking','Seen','Confirmed','Approved'].map((n,i)=>`<div class="${i<=at?'on':''}"><i></i>${n}</div>`).join('')}</div>`}</div>
  ${fi?`<img src="${fi}" alt="Proof attached by AZAPLUG" style="width:100%;border-radius:14px;margin-top:14px">`:''}
  <div class="card sum" style="margin-top:16px"><div><span>Account</span><b>${esc(t.accountTitleUsed||'Account')}</b></div><div><span>Date</span><b style="font-size:15px">${fd(d)} · ${ft(d)}</b></div>
   <div><span>Recipient gets</span>${t.creditedAmount!=null?`<b style="color:#0E9F6E">${naira(t.creditedAmount)}</b>`:'<b style="font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)">Set after review</b>'}</div>
   <div><span>Reference ID</span><b style="font-size:15px">${esc(String(t.id).slice(0,8).toUpperCase())} <button data-copy="${esc(t.id)}" aria-label="Copy reference" style="color:var(--soft);vertical-align:-3px">${I('copy','style="width:16px;height:16px"')}</button></b></div></div>
  <div class="card" style="margin-top:16px;padding:14px"><div class="cap" style="font-size:12px;margin-bottom:10px">Your receipt</div>${img?`<img src="${img}" alt="Receipt you uploaded" style="width:100%;border-radius:10px;display:block">`:'<p class="muted" style="font-size:14px">No receipt image</p>'}</div>
  <button class="btn sq" style="margin-top:20px;font-family:var(--body);font-weight:600" data-go="chat">${I('chat')} Chat with support</button></section>`},

history:()=>{const f={All:()=>1,Completed:t=>t.status==='approved',Pending:t=>['checking','seen','confirmed'].includes(t.status),Failed:t=>t.status==='failed'}[S.histTab];
 const rows=S.trades.filter(f);return `<section class="screen tabs">
  <div class="between" style="margin-bottom:18px"><h1 style="font-size:21px;font-weight:600">Transaction History</h1><button class="icon-btn" data-go="chat" aria-label="Chat with support">${I('chat')}</button></div>
  <div class="seg" role="tablist" style="margin-bottom:8px">${['All','Completed','Pending','Failed'].map(t=>`<button class="${S.histTab===t?'on':''}" data-set="histTab:${t}">${t}</button>`).join('')}</div>
  ${rows.length?rows.map(t=>tradeCard(t,1)).join(''):'<p class="empty">Nothing here yet</p>'}
  ${nav('history')}</section>`},

crypto:()=>{const k=S.coin,c=CRYPTO[k];return `<section class="screen tabs">
  <div class="between" style="margin-bottom:18px"><span class="brand">AZAPLUG</span>${bell()}</div>
  <div class="card"><div class="between"><span class="row" style="gap:12px"><span class="coin" style="background:${c.color}">${I('btc')}</span><span><b class="h" style="font-size:17px;font-weight:600;display:block;line-height:1.2">${c.name}</b><small class="muted">${c.pair}</small></span></span>
    <span class="toggle2">${['BTC','USDT'].map(x=>`<button class="${k===x?'on':''}" data-set="coin:${x}">${x}</button>`).join('')}</span></div>
   <div class="big" style="${c.rate?'':'font-size:22px;color:var(--muted)'}">${c.rate?naira(c.rate):'Rate not set yet'}</div>${c.rate?`<small class="muted">for every $1 of ${k} you send</small>`:''}</div>
  <button class="btn sq" style="margin:16px 0 10px" data-go="receive">${I('plusc')} Get Wallet</button>
  <button class="btn sq" style="margin:0 0 16px;background:#fff;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none" data-go="cryptoSend">${I('camera','style="width:18px;height:18px"')} Send Receipt</button>
  <div class="card"><b class="h" style="font-size:17px;font-weight:600">Our Fixed Rate</b><div class="h" style="font-size:20px;font-weight:700;margin:10px 0">${c.rate?`$1 = ${naira(c.rate)}`:'—'}</div><small class="muted">Rate is fixed from our end</small></div>
  ${nav('crypto')}</section>`},

cryptoSend:()=>{const k=S.coin,c=CRYPTO[k],img=safeImg(S.cimg);return `<section class="screen tabs">
  <div class="between" style="margin-bottom:22px"><span class="row" style="gap:14px"><button class="icon-btn" style="color:var(--slate)" data-go="crypto" aria-label="Back">${I('al')}</button><span class="brand">AZAPLUG</span></span><span></span></div>
  <h1 style="font-size:25px;font-weight:700">Send ${k} Receipt</h1><p class="muted" style="margin-bottom:18px">After you send ${c.label} to our wallet, upload the screenshot here. It goes straight to the admin.</p>
  <form data-form="cryptoSend" class="card" novalidate>
   <span class="toggle2" style="margin-bottom:14px">${['BTC','USDT'].map(x=>`<button type="button" class="${k===x?'on':''}" data-set="coin:${x}">${x}</button>`).join('')}</span>
   <label class="lb muted" for="cs-a" style="font-size:13.5px;margin:0 0 8px;display:block">Amount you sent (in dollars)</label>
   <div class="field sm" style="background:#F4F7FC"><b style="color:var(--blue)">$</b><input id="cs-a" inputmode="decimal" placeholder="0.00" value="${esc(S.cusd||'')}" style="font-family:var(--head);font-weight:500;font-size:17px"></div>
   <p id="cs-get" style="color:var(--muted);font-weight:600;font-size:13px;margin:10px 0 16px">${csGet()}</p>
   <label class="upload" style="${img?'height:auto;padding:10px':''}">${img?`<img src="${img}" alt="Receipt preview" style="max-width:100%;max-height:220px;border-radius:10px">`:`<span class="c">${I('camera','style="width:18px;height:18px"')}</span>`}<span>${img?'Tap to change photo':'Upload transfer screenshot'}</span><input id="cs-file" type="file" accept="image/*" hidden></label>
   <button class="btn sq" style="height:50px;box-shadow:none;font-family:var(--body);margin-top:16px">Send Receipt to Admin</button></form>
  ${nav('crypto')}</section>`},

receive:()=>{const k=S.coin,c=CRYPTO[k];return `<section class="screen tabs">
  <div class="between" style="margin-bottom:22px"><span class="row" style="gap:14px"><button class="icon-btn" style="color:var(--slate)" data-go="crypto" aria-label="Back">${I('al')}</button><span class="brand">AZAPLUG</span></span><span></span></div>
  <h1 style="font-size:25px;font-weight:700">Receive ${k}</h1><p class="muted" style="margin-bottom:22px">Receive ${c.label} directly to your wallet</p>
  ${c.address?`<div class="card" style="text-align:center;padding:30px 20px"><span class="badge" style="background:#E2E9F8;color:var(--blue);font-family:var(--head);font-size:14px;padding:7px 16px">● &nbsp;${c.network}</span>

function msgsHtml(){if(!S.chat.length)return '<p class="empty">Send us a message and we will help you.</p>';let day='';
  return S.chat.map(m=>{const d=new Date(m.createdAt),ds=fd(d),img=safeImg(m.imageData),mine=m.sender==='user';

/* ---------- Render + navigation ---------- */
/* ---------- Back gesture: each screen is a history entry, so swiping back returns to the previous screen ---------- */
const NAV={stack:[],keys:['tradeId','tprev','prev','coin','histTab','homeTab','noteTab','after'],roots:['loading','splash','allow','home']};
function navPush(r){const snap={r,c:{}};NAV.keys.forEach(k=>snap.c[k]=S[k]);const st=NAV.stack;
  if(NAV.roots.includes(r)||!st.length){NAV.stack=[snap];try{history.replaceState({n:0},'')}catch(e){}}
  else if(st[st.length-1].r===r)st[st.length-1]=snap;
  else if(st.length>1&&st[st.length-2].r===r){st.pop();st[st.length-1]=snap;NAV.skip=true;try{history.back()}catch(e){NAV.skip=false}} // going to the screen you came from = going back
  else{st.push(snap);try{history.pushState({n:st.length-1},'')}catch(e){}}}
window.addEventListener('popstate',e=>{if(NAV.skip){NAV.skip=false;return}const n=e.state&&typeof e.state.n==='number'?e.state.n:0,st=NAV.stack;
  if(!st.length||n>=st.length)return;const snap=st[n];st.length=n+1;Object.assign(S,snap.c);go(snap.r,null,true)});
function goBack(target){const st=NAV.stack;if(st.length>1&&st[st.length-2].r===target){history.back();return true}return false}
/* ---------- Chat layout: header and message box stay put; only the messages scroll (also when the keyboard opens) ---------- */
function fitChat(){const c=$('.chat'),v=window.visualViewport;if(!c||!v)return;c.style.height=v.height+'px';c.style.top=v.offsetTop+'px'}
function chatBottom(){fitChat();vnPaint();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',chatBottom);visualViewport.addEventListener('scroll',fitChat)}
/* ---------- Voice notes ----------
   A voice note travels in the same field as a chat photo, as "data:audio/...;dur=SECONDS;w=WAVEFORM;base64,...".
   dur and w are ours (length and the bar heights); they are stripped off again before the sound is played. */
const VN={rec:null,MAX:120,id:null,audio:null};
const VN_URL=()=>'/api/chat/send';
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const vnMime=()=>window.MediaRecorder?['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'':'';
function vnParse(src){if(typeof src!=='string'||!/^data:audio\/[a-z0-9.+-]+[;,]/i.test(src))return null;
  const i=src.indexOf(','),head=src.slice(5,i).split(';'),get=k=>(head.find(p=>p.startsWith(k+'='))||'').slice(k.length+1);
  return {dur:Math.max(0,+get('dur')||0),w:/^[0-9]{8,64}$/.test(get('w'))?get('w'):'',type:head.filter(p=>!/^(dur|w)=/.test(p)&&p!=='base64').join(';'),b64:src.slice(i+1)}}
function voiceHtml(m){const v=vnParse(m.imageData);if(!v)return '';
  return `<div class="voice" data-vnid="${esc(m.id)}"><button type="button" class="pl" data-vn="play" aria-label="Play voice note">${I('play')}</button><span class="wave" data-vn="seek" aria-hidden="true">${(v.w||'24536475863524364758463524365746').split('').map(b=>`<i style="height:${4+b*2.6}px"></i>`).join('')}</span><span class="dur" data-d="${mmss(v.dur)}">${mmss(v.dur)}</span></div>`}
// Repaint every voice bubble: the one that is playing shows pause, its progress and the running time.
function vnPaint(){document.querySelectorAll('.voice[data-vnid]').forEach(el=>{const on=VN.audio&&el.dataset.vnid===String(VN.id),a=VN.audio,bars=el.querySelectorAll('.wave i'),d=el.querySelector('.dur'),pl=el.querySelector('.pl');
  const total=on?(VN.dur||(isFinite(a.duration)?a.duration:0)):0,frac=on&&total?Math.min(1,a.currentTime/total):0,playing=on&&!a.paused;
  bars.forEach((b,i)=>b.classList.toggle('on',on&&i<Math.round(frac*bars.length)));
  if(pl.dataset.p!==String(playing)){pl.dataset.p=String(playing);pl.innerHTML=I(playing?'pause':'play');pl.setAttribute('aria-label',(playing?'Pause':'Play')+' voice note')}
  d.textContent=on&&a.currentTime>0?mmss(a.currentTime):d.dataset.d})}
function vnStop(){const a=VN.audio;if(a){a.onended=a.onerror=a.ontimeupdate=a.onplay=a.onpause=null;a.pause();if(VN.url)URL.revokeObjectURL(VN.url)}VN.audio=null;VN.id=null;VN.url=null;vnPaint()}
function vnPlay(id,frac){const m=S.chat.find(x=>String(x.id)===String(id)),v=m&&vnParse(m.imageData);if(!v)return;
  if(VN.audio&&String(VN.id)===String(id)){const a=VN.audio;if(frac!=null&&VN.dur){a.currentTime=frac*VN.dur;if(a.paused)a.play().catch(()=>{})}else a.paused?a.play().catch(()=>{}):a.pause();return}
  vnStop();
  try{const bin=atob(v.b64.replace(/\s/g,'')),u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);VN.url=URL.createObjectURL(new Blob([u8],{type:v.type}))}catch(e){return toast('This voice note is damaged')}
  const a=new Audio(VN.url);VN.audio=a;VN.id=id;VN.dur=v.dur;
  a.ontimeupdate=a.onplay=a.onpause=vnPaint;a.onended=vnStop;a.onerror=()=>{vnStop();toast('This voice note cannot be played on this phone')};

  <button class="btn axb">${v.mode==='setup'?'Verify and Save PIN':'Verify and Create Account'}</button></form><button type="button" class="axl" data-ax="resend">Send the code again</button></section>`},
 setpin:()=>`<section class="ax"><span></span><h1>Create your 6-digit PIN</h1><p class="sub">AZAPLUG now uses a 6-digit PIN instead of a password. Add your email too, so you can get back in if you ever forget your PIN.</p>
  <form data-form="setpin" novalidate>${axIn('sp-e','Email address','type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" value="'+esc((S.sp||{}).email||'')+'"')}${axPin('sp-p','New 6-digit PIN','new-password')}${axPin('sp-p2','Type the PIN again','new-password')}
  <button class="btn axb">Continue</button></form><button type="button" class="axl" data-ax="logout">Log out</button></section>`,
 forgot:()=>`<section class="ax">${axTop('login')}<h1>Forgot your PIN?</h1><p class="sub">Enter the phone number on your account. We will email a code to the address you signed up with.</p>
  <form data-form="forgot" novalidate>${axIn('fg-p','Phone number','type="tel" placeholder="0801 234 5678" autocomplete="username"')}<button class="btn axb">Send Code</button></form></section>`,
 reset:()=>{const v=S.vf||{};return `<section class="ax">${axTop('forgot')}<h1>Choose a new PIN</h1><p class="sub">We sent a 6-digit code to <b>${esc(v.shown||'your email')}</b>. Enter it below with your new PIN.</p>
  <form data-form="reset" novalidate><label for="rs-c">Code from the email</label><input class="axi pin" id="rs-c" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
  ${axPin('rs-p','New 6-digit PIN','new-password')}${axPin('rs-p2','Type the PIN again','new-password')}<button class="btn axb">Save New PIN</button></form></section>`}
});
async function axRegister(b,code){await api('POST','/api/register',Object.assign({},b,code?{code}:{}));S.vf=null;await enter();bioOffer()}
// Sign-up: collect the form, email a code (when email is set up), then create the account.
async function axSignup(b,pin2){if(Object.keys(b).some(k=>k!=='email'&&!b[k]))throw new Error('Fill in every field');
  if(AX.cfg.pin&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(b.email||''))throw new Error('Enter a valid email address');
  pinOk(b.password,pin2);
  const d=await api('POST','/api/auth/signup-code',{role:AX.role,email:b.email,phone:b.phone,password:b.password});
  if(d.skip)return axRegister(b);
  S.vf={mode:'signup',data:b,shown:d.email};go('verify')}
Object.assign(FORMS,{
 async verify(){const v=S.vf||{},code=val('vf-c');if(!/^\d{6}$/.test(code))throw new Error('Enter the 6-digit code from your email');
  if(v.mode==='setup'){await api('POST','/api/auth/setup',Object.assign({role:AX.role,code},v.data));S.vf=null;toast('Your PIN is saved');await enter();bioOffer()}else await axRegister(v.data,code)},
 async setpin(){const email=val('sp-e').toLowerCase(),pin=$('#sp-p').value;S.sp={email};if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw new Error('Enter a valid email address');pinOk(pin,$('#sp-p2').value);
  const d=await api('POST','/api/auth/setup-code',{role:AX.role,email});
  if(d.skip){await api('POST','/api/auth/setup',{role:AX.role,email,pin});toast('Your PIN is saved');await enter();bioOffer();return}
  S.vf={mode:'setup',data:{email,pin},shown:d.email};go('verify')},
 async forgot(){const phone=val('fg-p');if(!phone)throw new Error('Enter your phone number');const d=await api('POST','/api/auth/forgot',{role:AX.role,phone});S.vf={mode:'reset',phone,shown:d.email};go('reset')},
 async reset(){const v=S.vf||{},code=val('rs-c'),pin=$('#rs-p').value;if(!/^\d{6}$/.test(code))throw new Error('Enter the 6-digit code from your email');pinOk(pin,$('#rs-p2').value);
  await api('POST','/api/auth/reset',{role:AX.role,phone:v.phone,code,pin});S.vf=null;toast('Your new PIN is saved');await enter();bioOffer()}
});
AXA.resend=async()=>{const v=S.vf||{};try{const d=v.mode==='setup'?await api('POST','/api/auth/setup-code',{role:AX.role,email:v.data.email}):await api('POST','/api/auth/signup-code',{role:AX.role,email:v.data.email,phone:v.data.phone});toast(d.wait?'We just sent one. Wait a minute before asking again':'We sent a new code')}catch(e){toast(e.message)}};
AXA.logout=async()=>{try{await api('POST','/api/logout')}catch(e){}S.me=null;go(BIO.login)};
AXA.oldpw=()=>{S.oldpw=!S.oldpw;render()};
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('pin'))e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
if(lsGet(BIO.key)){go('lock');bioUnlock(true)}else enter().catch(()=>go('splash'));
</script>
