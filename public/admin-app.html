<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D4DC7">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZAPLUG Admin">
<title>AZAPLUG Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Brand tokens (AZAPLUG Brand Guidelines v1.0) ---------- */
:root{
  --blue:#0D4DC7; --blue-dark:#0A3FA6; --slate:#111827; --bg:#F4F7FC;
  --green:#10B981; --orange:#F59E0B; --red:#EF4444;
  --muted:#6B7280; --soft:#9CA3AF; --line:#E3E8F1; --card:#fff;
  --head:'Outfit',system-ui,sans-serif; --body:'Geist','Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --r-card:24px; --r-field:12px; --m:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E6EAF2;font-family:var(--body);color:var(--slate);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:var(--w);margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.screen{min-height:100dvh;padding:28px var(--m) 40px;display:flex;flex-direction:column}
.screen.tabs{padding-bottom:130px}
.screen.white{background:#fff}
.screen.blue{background:var(--blue);color:#fff}
h1,h2,h3,.h{font-family:var(--head);letter-spacing:-.01em}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:999px;background:var(--blue);color:#fff;font-family:var(--head);font-weight:700;font-size:17px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985);background:var(--blue-dark)}
.btn.sq{border-radius:16px;height:56px;box-shadow:0 10px 22px -10px rgba(13,77,199,.55)}
.btn.white{background:#fff;color:var(--blue)}
.btn.outline{background:#fff;color:var(--slate);border:1.5px solid #D9DEE8;font-family:var(--body);font-weight:500;font-size:18px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);flex:none}
.icon-btn.sqr{border-radius:12px;color:var(--slate)}
.link{color:var(--blue);font-weight:700}

/* ---------- Fields ---------- */
label.lb{display:block;font-weight:600;font-size:15px;margin:22px 0 10px}
.field{display:flex;align-items:center;gap:10px;height:58px;border:1.5px solid #E1E5EC;border-radius:var(--r-field);background:#fff;padding:0 18px}
.field:focus-within{border-color:var(--blue)}
.field input,.field select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.field input::placeholder{color:#9CA3AF}
.field select{appearance:none;-webkit-appearance:none;font-weight:600}
.field .eye{color:#4B5563}
.field.sm{height:52px}

/* ---------- Cards / badges ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-approved,.b-processing{background:#E4F6EE;color:#0E9F6E}
.b-checking{background:#FEEFC3;color:#E08A00}
.b-confirmed,.b-compensation,.b-draft,.b-live{background:#EAF1FE;color:var(--blue)}
.b-failed{background:#FDE0E0;color:var(--red)}
.cap{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- Top bars ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:44px}
.top .title{font-family:var(--head);font-weight:700;font-size:20px;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.top.left .title{position:static;text-align:left;font-size:24px;margin-left:14px;flex:1}
.brand{font-family:var(--head);font-weight:800;font-size:22px;color:var(--blue);letter-spacing:0}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(var(--w) - 40px);height:76px;background:var(--blue);border-radius:38px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 14px 30px -10px rgba(13,77,199,.6);z-index:20}
.nav button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.72);font-size:11.5px;font-weight:500;flex:1 1 0;min-width:0}
.nav button.on{color:#fff;font-weight:700}
.nav svg.i{width:23px;height:23px}
.fab{position:fixed;bottom:108px;right:calc(50% - var(--w) / 2 + 22px);width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(13,77,199,.7);z-index:21}
.fab.low{bottom:28px}

/* ---------- Segments ---------- */
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}

/* ---------- Auth ---------- */
.logo-dot{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto}
.logo-dot svg.i{width:40px;height:40px;stroke-width:1.6}
.logo-dot.sm{width:64px;height:64px}.logo-dot.sm svg.i{width:26px;height:26px;stroke-width:2}
.wordmark{font-family:var(--head);font-weight:800;font-size:36px;text-align:center}
.role{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);text-align:left;margin-top:14px;color:#fff}
.role .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.role b{font-family:var(--head);font-size:19px;font-weight:700;display:block}
.role span{font-size:14px;opacity:.8}
.role.on{background:#fff;color:var(--blue);box-shadow:0 12px 26px -10px rgba(0,0,0,.35)}
.role.on .ic{background:#EEF2FB}
.role .chev{margin-left:auto;opacity:.7}
.auth h1{font-size:32px;font-weight:800;line-height:1.15}
.auth .sub{color:#4B5563;font-size:16px;margin-top:10px}
.or{display:flex;align-items:center;gap:20px;color:var(--muted);margin:22px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:#E1E5EC}
.finger{width:180px;height:180px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#F5F7FD;border:1px solid #E1E7F5}
.finger i{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:#E7ECF9;border:1px solid #D2DBF2}
.finger b{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 10px 22px -6px rgba(13,77,199,.6)}
.finger svg.i{width:44px;height:44px;stroke-width:1.5}

/* ---------- Home ---------- */
.balance{background:var(--blue);color:#fff;border-radius:28px;padding:22px 20px 20px;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.balance small{font-size:13px;opacity:.85}
.balance .amt{font-family:var(--head);font-weight:800;font-size:36px;line-height:1.2;margin:4px 0 16px}
.pills{display:flex;gap:8px}
.pills button{flex:1;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;padding:0;min-width:0}
.pills button:first-child{font-size:11px;flex:1.1}
.pills button.on{background:#fff;color:var(--blue);border-color:#fff}
.txn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}
.txn .nm{font-family:var(--head);font-weight:600;font-size:16.5px}
.txn .dt{font-size:12px;color:var(--soft);margin-top:2px}
.txn .rt{margin-left:auto;text-align:right}
.txn .am{font-family:var(--head);font-weight:700;font-size:16.5px;margin-bottom:4px}
.flag{width:40px;height:40px;border-radius:50%;background:#EEF1F6;display:grid;place-items:center;font-size:24px;line-height:1;overflow:hidden;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 4px}
.sec-h h3{font-size:17px;font-weight:600}

/* ---------- Get account ---------- */
.acct .mono{font-family:var(--mono);font-weight:700;font-size:13px;margin-top:12px}
.noimg{height:100px;border-radius:14px;background:#EEF2F8;border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:8px;color:#9AA3B5;font-family:var(--mono);font-size:13px;margin-top:14px}
.noimg svg.i{width:26px;height:26px}
.copy{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--slate);background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:0 2px 0 rgba(17,24,39,.15)}
.kv{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;padding:7px 14px;font-size:13px;border-top:1px solid #EEF1F6}
.kv div:first-child{border-top:0}
.kv b{font-family:var(--mono);font-weight:700}
.kv span{color:var(--muted)}

/* ---------- Summary rows ---------- */
.sum div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.sum span{color:#4B5563}
.sum b{font-family:var(--head);font-weight:700;font-size:17px}
.sum.plain b{font-family:var(--body);font-weight:500;font-size:15px}
.hr,.sum div.hr{height:1px;background:var(--line);margin:8px 0;padding:0}
.ok-ring{width:104px;height:104px;border-radius:50%;background:#E3EAF8;display:grid;place-items:center;margin:8px auto 18px}
.ok-ring i{width:80px;height:80px;border-radius:50%;background:#C9D6F3;display:grid;place-items:center}
.ok-ring b{width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.ok-ring svg.i{width:28px;height:28px}
.upload{display:grid;place-items:center;align-content:center;gap:10px;height:106px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--soft);cursor:pointer;width:100%}
.upload span.c{width:36px;height:36px;border-radius:50%;background:#F1F4F9;border:1px solid var(--line);display:grid;place-items:center;color:#4B5563}

/* ---------- Crypto ---------- */
.toggle2{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.toggle2 button{padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.toggle2 button.on{background:var(--blue);color:#fff}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.coin svg.i{width:18px;height:18px}
.big{font-family:var(--head);font-weight:800;font-size:32px;margin-top:16px}
.qr{width:200px;height:200px;margin:26px auto 18px;position:relative}

/* ---------- Chat ---------- */
.chat{padding:0;background:#E8EEF8;min-height:100dvh;display:flex;flex-direction:column}
.chat-top{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700;position:relative;flex:none}
.avatar:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.msgs{flex:1;padding:18px 16px 110px;display:flex;flex-direction:column;gap:20px}
.day{align-self:center;background:#DDE3EE;color:#6B7280;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.03em}
.msg{max-width:80%;padding:12px 15px 9px;border-radius:18px;font-size:15px;line-height:1.45;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.msg.in{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.msg.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{display:block;color:var(--blue);font-weight:700;font-size:13px;margin-bottom:3px}
.msg time{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:3px}
.voice{display:flex;align-items:center;gap:10px}
.voice .pl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.voice .pl svg.i{width:15px;height:15px;stroke-width:2.5}
.msg.in .pl{background:var(--blue);color:#fff}.msg.out .pl{background:#fff;color:var(--blue)}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;border-radius:2px;background:currentColor;opacity:.9}
.msg.in .wave{color:var(--blue)}
.shot{height:150px;border-radius:14px;background:linear-gradient(135deg,#C6D8DE,#E9F0F3);display:grid;place-items:center;color:#5B6B7A;font-size:12px;margin-bottom:8px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:var(--w);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.composer .inp{flex:1;min-width:0;display:flex;align-items:center;height:42px;border-radius:999px;background:#F1F3F7;padding:0 14px;color:#6B7280}
.composer input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.composer .rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#F1F3F7;color:#6B7280;flex:none}
.composer .rb.send{background:var(--blue);color:#fff;box-shadow:0 6px 14px -4px rgba(13,77,199,.6)}

/* ---------- Profile ---------- */
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.hero .ph{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;margin:0 auto 14px;font-family:var(--head);font-weight:700;font-size:30px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.info span{color:var(--muted)}.info b{font-weight:600;text-align:right;word-break:break-word}
.pref{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.pref b{font-family:var(--head);font-weight:600;display:block}.pref small{color:var(--muted);font-size:12.5px}
.sw{width:46px;height:26px;border-radius:999px;background:#D5D9E2;position:relative;transition:.15s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on:after{left:23px}
.menu{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;font-family:var(--head);font-weight:600;font-size:15.5px;text-align:left}
.menu .ic{width:36px;height:36px;border-radius:50%;background:#EEF2FB;color:var(--blue);display:grid;place-items:center}
.menu .chev{margin-left:auto;color:var(--soft)}
.menu.danger{color:var(--red)}.menu.danger .ic{background:#FDE0E0;color:var(--red)}.menu.danger .chev{color:var(--red)}

/* ---------- Notifications / rules / loan ---------- */
.note{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.note.unread{border:1.5px solid var(--blue)}
.note .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.note h4{font-family:var(--head);font-weight:600;font-size:15.5px}
.note p{font-size:13px;color:var(--muted);margin-top:4px}
.note .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:middle}
.rules p{font-weight:500;font-size:14.5px;margin-bottom:18px;line-height:1.35}
.warn{display:flex;gap:14px;align-items:center;background:#FEF9E6;border:1px solid #F8DE8B;border-radius:18px;padding:16px;color:#B45309}
.warn b{font-family:var(--head);display:block}.warn p{font-size:13px}
.tile{border-radius:16px;padding:16px;margin-top:14px}
.banner{display:flex;align-items:center;gap:10px;background:#E6ECF9;color:var(--blue);font-weight:600;border-radius:12px;padding:12px 14px;margin-bottom:22px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:50;max-width:340px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--soft);padding:40px 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.blue :focus-visible{outline-color:#fff}
.btn:disabled{opacity:.7}
a.role{display:flex}

/* ---------- Admin ---------- */
.scr{min-height:100dvh;background:#F7F9FC}
.hd{display:flex;align-items:center;gap:14px;background:#fff;padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.hd h1{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.2}
.hd p{font-size:12.5px;color:#4B5563}
.hd .bk{width:36px;height:36px;border-radius:50%;background:#EAF1FE;color:var(--blue);display:grid;place-items:center;flex:none}
.hd .bk svg{width:17px;height:17px;stroke-width:2.5}
.hd.dark{background:#111827;color:#fff;border:0}.hd.dark p{color:#9CA3AF}.hd.dark .bk{background:rgba(255,255,255,.12);color:#fff}.hd.dark h1{font-size:17px}
.hd.blue{background:linear-gradient(#0D4DC7,#0A3A9E);color:#fff;border:0}.hd.blue p{color:rgba(255,255,255,.8)}.hd.blue .bk{background:rgba(255,255,255,.18);color:#fff}.hd.blue h1{font-size:18px}
.bd{padding:18px 20px 44px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{gap:6px;margin-top:14px}.g4 .sb{font-size:10.5px;height:44px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:block;box-shadow:0 2px 6px rgba(17,24,39,.04);min-width:0}
.stat small{display:block;font-size:13px;color:#4B5563}.stat b{display:block;font-family:var(--head);font-size:24px;font-weight:700;margin:6px 0 4px;line-height:1.2}.stat i{font-style:normal;font-size:12px;color:#4B5563}
.stat.sm{padding:10px 12px;border-radius:12px}.stat.sm small{font-size:11px}.stat.sm b{font-size:17px;margin:3px 0 2px}.stat.sm i{font-size:10.5px;color:var(--soft)}
.sh{font-family:var(--head);font-size:16px;font-weight:600;margin:22px 0 12px}
.qa{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:13.5px;box-shadow:0 2px 6px rgba(17,24,39,.04)}
.qa span{width:42px;height:42px;border-radius:50%;background:#EEF3FE;color:var(--blue);display:grid;place-items:center}
.feed{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.feed>i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.feed b{display:block;font-size:14px;font-weight:600}.feed small{font-size:12px;color:#4B5563}.feed em{font-style:normal;font-weight:700;color:var(--blue);font-size:14px;white-space:nowrap}
.write{display:flex;gap:6px;align-items:center;background:#EAF1FE;border:1px solid #BFD3F8;color:var(--blue);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px}

async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}

  return d;
}

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=e=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const c=document.createElement('canvas'),k=Math.min(1,1000/img.width);c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};img.src=e.target.result};fr.readAsDataURL(file)})}

trade:()=>{const t=S.trades.find(x=>x.id===S.id);if(!t)return V.receipts();const img=safeImg(t.receiptImage),b=tBadge(t),fi=safeImg(t.failImage),canCredit=t.status==='approved'&&t.creditedAmount==null;
 const row=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
 return `<section class="scr">${hd('Trade '+tid(t),'Full Review &amp; Admin Controls',S.back==='user'?'user':'receipts')}
 <div class="bd"><div class="card row" style="gap:12px;padding:14px">${av(t.userName)}<span class="grow" style="min-width:0"><b class="h" style="font-size:15px;display:block">${esc(t.userName)}</b><small class="muted">${esc(t.userPhone)}</small></span><span class="badge ${b[1]} xs">${b[0]}</span></div>

   ${!t.accountId&&/bitcoin|usdt/i.test(t.accountTitleUsed||'')?(r=>row('Crypto receipt',`$${n0(t.intendedAmount)} sent`+(r?`<br>At $1 = ${naira(r)}: <b>${naira(t.intendedAmount*r)}</b>`:'<br>Set the rate under Edit Rates')))(/bitcoin/i.test(t.accountTitleUsed)?S.settings.btcRate:S.settings.usdtRate):''}

  <form data-form="loanLimit" class="card" style="padding:14px;border-radius:14px;margin-bottom:14px" novalidate><label class="cl" for="ln-lim" style="margin-top:0">Maximum loan per customer (₦)</label>
   <div class="row" style="gap:8px"><input class="in" id="ln-lim" inputmode="decimal" value="${esc(S.loanLimit)}"><button class="sb blue" style="flex:none;padding:0 18px;height:42px">Save</button></div></form>`}
  ${S.loans.length?S.loans.map(l=>`<article class="card" style="padding:16px;border-radius:14px;margin-bottom:12px"><div class="between"><b class="h" style="font-size:16px">${esc(l.userName)}</b><span class="badge ${LS[l.status][1]}">${LS[l.status][0]}</span></div>
   <small class="muted">Submitted: ${fd(l.createdAt)}</small>
   <div class="g2" style="margin-top:12px"><div><small class="muted" style="display:block;font-size:12px">Requested Amount</small><b class="h" style="font-size:18px">${naira(l.amount)}</b></div>
    <div><small class="muted" style="display:block;font-size:12px">${l.status==='active'?'Still Owed':l.status==='repaid'?'Still Owed':'Customer Balance'}</small><b class="h" style="font-size:18px;color:${l.status==='active'?'var(--red)':'var(--green)'}">${naira(l.status==='active'||l.status==='repaid'?l.outstanding:l.userBalance)}</b></div></div>
   <button class="b soft" style="margin-top:12px" data-go="user" data-id="${esc(l.userId)}">${I('users','style="width:16px;height:16px"')}View Customer Profile</button>
   ${l.status==='pending'?`<div class="row" style="gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><button class="sb o-red" style="height:42px" data-act="loanDecide" data-d="decline" data-id="${esc(l.id)}">Decline</button><button class="sb blue" style="height:42px" data-act="loanDecide" data-d="approve" data-id="${esc(l.id)}">Approve</button></div>`:''}</article>`).join(''):S.loanErr?'':'<p class="empty">No loan applications yet</p>'}</div></section>`},

giveaway:()=>{const list=S.gas,cur=list&&list.find(g=>g.status==='open'),past=list?list.filter(g=>g!==cur):[];
 const when=t=>new Date(t).toLocaleString('en-NG',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
 const pad=n=>String(n).padStart(2,'0'),dflt=(()=>{const d=new Date();d.setHours(12,0,0,0);if(d<new Date())d.setDate(d.getDate()+1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T12:00`})();
 const card=(g,open)=>{const w=g.entries.filter(e=>e.won),unpaid=w.filter(e=>!e.credited),late=g.entries.filter(e=>!e.won);
  return `<article class="card" style="padding:16px;border-radius:14px;margin-bottom:14px"><div class="between"><b class="h" style="font-size:16.5px">${esc(g.title)}</b><span class="badge ${open?(g.live?'b-approved':'b-checking'):'b-confirmed'}">${open?(g.live?'LIVE':'SCHEDULED'):'ENDED'}</span></div>
   <small class="muted" style="display:block;margin-top:4px">${naira(g.amount)} × ${g.winners} winners · say "${esc(g.keyword)}" · starts ${when(g.startsAt)}</small>
   <div class="g2" style="margin:12px 0"><div class="stat" style="padding:12px"><small>Winners</small><b>${w.length}<span style="font-size:14px;color:var(--muted)"> / ${g.winners}</span></b></div><div class="stat" style="padding:12px"><small>Paid</small><b>${naira((w.length-unpaid.length)*g.amount)}</b></div></div>
   ${unpaid.length?`<button class="b green" data-act="gaCredit" data-id="${esc(g.id)}">Credit ${unpaid.length} winner${unpaid.length===1?'':'s'} · ${naira(unpaid.length*g.amount)}</button>`:''}
   ${w.length?`<div class="cl" style="margin-top:14px">Winners (first ${g.winners} to say ${esc(g.keyword)} in the installed app)</div>${w.map((e,i)=>`<div class="gar"><b>#${i+1}</b><span class="grow" style="min-width:0"><b style="display:block">${esc(e.name)}</b><small class="muted">${esc(e.phone)} · ${new Date(e.createdAt).toLocaleTimeString('en-NG',{hour:'numeric',minute:'2-digit',second:'2-digit'})} · ${I('mobile','style="width:13px;height:13px;vertical-align:-2px"')} App${e.alertsOn?' · '+I('bell','style="width:14px;height:14px;vertical-align:-2px"'):''}</small></span>${e.credited?'<span class="tagx g">Paid</span>':`<button class="mini" data-act="gaCredit" data-id="${esc(g.id)}" data-entry="${esc(e.id)}">Pay</button>`}</div>`).join('')}`:`<p class="empty" style="padding:12px 0">${g.live?'Waiting for the first "'+esc(g.keyword)+'"…':'No winners yet'}</p>`}
   ${late.length?`<small class="muted" style="display:block;margin-top:8px">${late.length} more customer${late.length===1?'':'s'} said ${esc(g.keyword)} after the spots were filled.</small>`:''}
   ${open?`<button class="b soft" style="margin-top:12px" data-act="gaEnd" data-id="${esc(g.id)}">End giveaway</button>`:''}</article>`};
 return `<section class="scr">${hd('Giveaways','First customers to say hi win','dash')}<div class="bd">
  ${S.gaErr?`<div class="warn2" style="margin-bottom:14px">${I('alertt','style="width:16px;height:16px;flex:none"')}<span>${esc(S.gaErr)}</span></div>`:!list?'<p class="empty">Loading…</p>':''}
  ${cur?card(cur,true):list&&!S.gaErr?`<form data-form="gaNew" class="card" style="padding:16px;border-radius:14px;margin-bottom:14px" novalidate><b class="h" style="font-size:16.5px">New giveaway</b>
   <label class="cl" for="ga-t">Title</label><input class="in" id="ga-t" value="₦1,000 Giveaway">
   <div class="g2"><div><label class="cl" for="ga-a">Each winner gets (₦)</label><input class="in" id="ga-a" inputmode="decimal" value="1000"></div><div><label class="cl" for="ga-w">Number of winners</label><input class="in" id="ga-w" inputmode="numeric" value="30"></div></div>
   <div class="g2"><div><label class="cl" for="ga-k">Word to say</label><input class="in" id="ga-k" value="hi"></div><div><label class="cl" for="ga-s">Starts</label><input class="in" id="ga-s" type="datetime-local" value="${dflt}"></div></div>
   <label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px"><input type="checkbox" id="ga-n" checked style="width:20px;height:20px"> Send a notification to all customers now</label>
   <button class="b blue" style="margin-top:14px">Create Giveaway</button>
   <small class="muted" style="display:block;margin-top:8px">Only customers using the installed app can win. Each customer can win once. Winners get an automatic reply in chat.</small></form>`:''}
  ${past.length?`<h2 class="sh">Past giveaways</h2>${past.map(g=>card(g,false)).join('')}`:''}</div></section>`},

announce:()=>`<section class="scr">${hd('Write','Announcement to all customers','dash')}
 <div class="bd"><form data-form="announce" novalidate><label class="cl" for="an-t" style="margin-top:0">Title</label><input class="in" id="an-t" maxlength="80" placeholder="e.g. New Mexico rate">
  <label class="cl" for="an-b">Message</label><textarea class="in" id="an-b" rows="5" maxlength="400" placeholder="What should every customer know?"></textarea>
  <p style="background:#EEF2F8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#4B5563;margin-top:14px">Every customer sees this in their Notifications. Customers who turned on push also get it on their phone.</p>
  <button class="b blue">Send to all customers</button></form></div></section>`,

users:()=>{const list=S.users.filter(u=>S.userTab==='all'||(S.userTab==='alertson'?u.alerts>0:S.userTab==='alertsoff'?!u.alerts:S.userTab==='approved'?u.status==='approved':u.status!=='approved'));
 return `<section class="scr"><div class="bd" style="padding-top:24px"><div class="top" style="margin-bottom:12px"><button class="icon-btn sqr" style="width:36px;height:36px" data-go="dash" aria-label="Back">${I('cl','style="width:16px;height:16px"')}</button>
   <span class="title" style="line-height:1.2">Users<small class="muted" style="display:block;font:400 12.5px var(--body)">${S.users.filter(u=>u.status==='approved').length} total approved accounts</small></span><span></span></div>
  ${search('Search users, banks, or accounts...')}
  <div class="chips">${[['all','All Users'],['alertson','Alerts On'],['alertsoff','Alerts Off'],['approved','Approved'],['suspended','Suspended']].map(c=>`<button class="${S.userTab===c[0]?'on':''}" data-set="userTab:${c[0]}">${c[1]}</button>`).join('')}</div>
  <div id="list">${list.length?list.map(u=>{const ok=u.status==='approved';return `<article class="card uc" data-k="${esc((u.name+' '+u.phone+' '+u.bankName+' '+u.accountNumber).toLowerCase())}">
   <button class="between" style="width:100%;text-align:left;align-items:flex-start" data-go="user" data-id="${esc(u.id)}"><span style="min-width:0"><b class="h" style="font-size:15.5px;display:block;word-break:break-word">${esc(u.name)}</b><small class="muted">Balance: <b style="color:var(--slate)">${naira(u.balance)}</b></small><small style="display:block;margin-top:3px;font-weight:600;color:${u.alerts?'var(--green)':'var(--orange)'}">${u.alerts?I('bell','style="width:14px;height:14px;vertical-align:-2px"')+' Notifications on'+(u.alerts>1?' · '+u.alerts+' phones':''):I('belloff','style="width:14px;height:14px;vertical-align:-2px"')+' Notifications off'}</small></span><span class="badge ${ok?'b-approved':'b-failed'} xs">${ok?'APPROVED':'SUSPENDED'}</span></button>
   <div class="ur"><div><span>PHONE</span><b>${esc(u.phone)}</b></div><div><span>BANK</span><b>${esc(u.bankName)}</b></div><div><span>ACCOUNT NO</span><b style="font-weight:700">${esc(u.accountNumber)}</b></div></div>
   <div class="row" style="gap:8px"><button class="sb s-blue" data-act="userEdit" data-id="${esc(u.id)}">${I('pen','style="width:13px;height:13px"')}Edit</button>
    ${ok?`<button class="sb s-yellow" data-act="userSuspend" data-id="${esc(u.id)}">Suspend</button>`:`<button class="sb s-green" data-act="userApprove" data-id="${esc(u.id)}">Approve</button>`}
    <button class="sb s-red" data-act="userDelete" data-id="${esc(u.id)}">${I('trash','style="width:13px;height:13px"')}Delete</button></div></article>`}).join(''):'<p class="empty">No users here</p>'}</div></div></section>`},

user:()=>{const u=S.users.find(x=>x.id===S.uid);if(!u)return V.users();const ok=u.status==='approved';
 const tx=[...S.trades.filter(t=>t.userId===u.id).map(t=>({at:t.createdAt,n:(t.accountTitleUsed||'Trade')+' receipt',r:t.creditedAmount!=null?'+ '+naira(t.creditedAmount):n0(t.intendedAmount),s:tBadge(t)[0],in:1,id:t.id})),
   ...S.wds.filter(w=>w.userId===u.id).map(w=>({at:w.createdAt,n:'Withdrawal',r:'- '+naira(w.amount),s:wBadge(w)[0],wid:w.id}))].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,6);
 return `<section class="scr"><div class="bd" style="padding-top:24px"><div class="top"><button class="icon-btn sqr" style="width:36px;height:36px" data-go="users" aria-label="Back">${I('cl','style="width:16px;height:16px"')}</button><span class="title" style="font-size:17px">User Profile</span><span></span></div>
  <div class="card" style="text-align:center">${av(u.name,'xl')}<h2 class="h" style="font-size:19px;margin-top:12px;word-break:break-word">${esc(u.name)}</h2><p class="muted" style="font-size:13.5px">${esc(u.bankName)} Customer</p>
   <span class="badge ${ok?'b-approved':'b-failed'} xs" style="margin-top:8px">${ok?'APPROVED ACCOUNT':'SUSPENDED ACCOUNT'}</span><div class="hr" style="margin:16px 0 12px"></div>
   <div style="text-align:left"><small class="cl" style="margin:0">Balance</small><b class="h" style="font-size:18px;display:block">${naira(u.balance)}</b></div></div>
  <div class="row" style="gap:8px;margin:14px 0"><a class="sb s-blue" style="height:40px" href="tel:${esc(String(u.phone).replace(/[^0-9+]/g,''))}">${I('phone','style="width:14px;height:14px"')}Call</a><button class="sb s-green" style="height:40px" data-go="chat" data-from="user" data-id="${esc(u.id)}">${I('chat','style="width:14px;height:14px"')}Chat</button><button class="sb indigo" style="height:40px" data-act="userEdit" data-id="${esc(u.id)}">${I('pen','style="width:14px;height:14px"')}Edit</button></div>
  <div class="card"><b class="cl" style="margin:0;color:var(--slate);font-size:13px">Contact &amp; account info</b><div class="ur" style="border-bottom:0;margin-bottom:0;padding-bottom:0"><div><span>PHONE</span><b>${esc(u.phone)}</b></div><div><span>BANK NAME</span><b>${esc(u.bankName)}</b></div><div><span>ACCOUNT NO</span><b style="font-weight:700">${esc(u.accountNumber)}</b></div></div></div>
  <h2 class="cl" style="color:var(--slate);font-size:13px;margin:20px 0 10px">Recent transactions</h2>
  ${tx.length?tx.map(x=>`<button class="feed" ${x.id?`data-go="trade" data-from="user" data-id="${esc(x.id)}"`:`data-go="wd" data-id="${esc(x.wid)}"`}><span class="av sm" style="background:${x.in?'#E4F6EE':'#EAF1FE'};color:${x.in?'#0E9F6E':'var(--blue)'}">${I(x.in?'adl':'share','style="width:14px;height:14px"')}</span><span class="grow" style="min-width:0"><b>${esc(x.n)}</b><small>${ago(x.at)}, ${ft(x.at)}</small></span><em style="text-align:right;color:var(--slate)">${x.r}<small style="display:block;font-weight:400;color:var(--soft)">${x.s}</small></em></button>`).join(''):'<p class="empty" style="padding:16px 0">No transactions yet</p>'}
  <h2 class="cl" style="color:var(--slate);font-size:13px;margin:20px 0 10px">Activity history</h2>
  <div class="card" style="padding:14px 16px"><b style="font-size:13.5px;display:block">Account created</b><small class="muted">System Registration • ${fd(u.createdAt)}</small></div></div></section>`},

userEdit:()=>{const u=S.users.find(x=>x.id===S.id);if(!u)return V.users();return `<section class="scr">${hd('Edit User',esc(u.phone),S.back)}
 <div class="bd"><form data-form="userEdit" novalidate><label class="cl" for="u-n" style="margin-top:0">Full name</label><input class="in" id="u-n" value="${esc(u.name)}">
  <label class="cl" for="u-b">Bank name</label><input class="in" id="u-b" value="${esc(u.bankName)}"><label class="cl" for="u-a">Account number</label><input class="in" id="u-a" inputmode="numeric" value="${esc(u.accountNumber)}">
  <button class="b blue">Save Change</button></form><button class="b red" data-go="${S.back}">Cancel Change</button></div></section>`},

rates:()=>`<section class="scr">${hd('Rates &amp; Rules','Admin Controls • Strict Overrides','dash')}
 <div style="background:#fff;padding:12px 20px;display:flex;gap:10px">${[['rates','Rates Panel'],['rules','Rules Policy']].map(t=>`<button class="tabb ${S.ratesTab===t[0]?'on':''}" data-set="ratesTab:${t[0]}">${t[1]}</button>`).join('')}</div>
 <div class="bd">${S.ratesTab==='rates'?`<div class="between" style="margin-bottom:12px"><b style="font-size:13.5px">Active Exchange Rates</b><small class="muted">Max limit ${naira(S.settings.maxDeposit)}</small></div>
  ${S.accounts.length?S.accounts.map(a=>`<article class="card rt2"><div class="between"><b class="h" style="font-size:14.5px">${esc(a.title)} <small class="muted" style="font:400 12px var(--body)">${esc(a.bankName)}</small></b><button data-act="acctEdit" data-from="rates" data-id="${esc(a.id)}" aria-label="Edit rates for ${esc(a.title)}" style="color:var(--blue)">${I('pen','style="width:16px;height:16px"')}</button></div>
   <div class="g2">${[['LOWER',n0(a.lowestAmount)],['Rate at lower',naira(a.lowestRate)],['HIGHER',n0(a.higherAmount)],['Rate at higher',naira(a.higherRate)],['Min Limit',naira(a.minAmount)],['Max Limit',naira(a.maxAmount)]].map(r=>`<div><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}</div></article>`).join(''):'<p class="empty">No accounts yet. Add one under Accounts.</p>'}
  <form data-form="cryptoRates" class="card rt2" novalidate><b class="h" style="font-size:14.5px">Bitcoin &amp; USDT <small class="muted" style="font:400 12px var(--body)">naira customers get for every $1</small></b>
   <div class="g2" style="margin-top:8px"><div><label class="cl" for="cr-btc" style="margin-top:0">Bitcoin: $1 = ₦</label><input class="in" id="cr-btc" inputmode="decimal" placeholder="Not set" value="${esc(S.settings.btcRate||'')}"></div>
    <div><label class="cl" for="cr-usdt" style="margin-top:0">USDT: $1 = ₦</label><input class="in" id="cr-usdt" inputmode="decimal" placeholder="Not set" value="${esc(S.settings.usdtRate||'')}"></div></div>
   <button class="b blue" style="margin-top:12px">Save Crypto Rates</button></form>
  <div class="pol"><b>System Policy Rules List</b><p>${esc((S.settings.rulesText||'No rules posted yet.').slice(0,220))}${(S.settings.rulesText||'').length>220?'…':''}</p><button class="link" style="font-size:13px" data-set="ratesTab:rules">+ Configure Policy Rules</button></div>`
 :`<form data-form="rules" novalidate><label class="cl" for="r-text" style="margin-top:0">Rules shown to customers</label><textarea class="in" id="r-text" rows="16">${esc(S.settings.rulesText||'')}</textarea>
  <label class="cl" for="r-max">Maximum deposit (₦)</label><input class="in" id="r-max" inputmode="decimal" value="${esc(S.settings.maxDeposit??'')}"><button class="b blue">Save Change</button></form>`}</div></section>`,

console:()=>{const open=S.escs.filter(e=>e.status==='open'),list=S.escTab==='open'?open:S.escTab==='resolved'?S.escs.filter(e=>e.status!=='open'):S.escs;
 return `<section class="scr">${hd('Admin Console <span class="sec">SECURE</span>','Priority &amp; Escalated Chats','chats',`<button class="bk" data-act="soon" aria-label="Console settings">${I('gear')}</button>`,'dark con')}
 <div class="bd">${search('Search escalated customers, staff, cases...')}
  <div class="chips">${[['open','Escalated',open.length],['fwd','Forwarded',fwNew()],['resolved','Resolved',S.escs.length-open.length],['all','All',S.escs.length]].map(c=>`<button class="${S.escTab===c[0]?'on gold':''}" data-set="escTab:${c[0]}">${c[1]} <i>${c[2]}</i></button>`).join('')}</div>
  ${S.escErr?`<div class="warn2" style="margin:0 0 14px">${I('alertt','style="width:16px;height:16px;flex:none"')}<span><b>Escalations could not be loaded.</b> ${esc(S.escErr)} If this is a new setup, run the escalations table SQL from the README in Supabase.</span></div>`:''}
  <div id="list">${S.escTab==='fwd'?(S.fwdErr?`<p class="empty">${esc(S.fwdErr)}</p>`:(S.fwds||[]).length?S.fwds.map(f=>`<article class="card fwc ${f.status==='new'?'':'done'}" data-k="${esc((f.userName+' '+f.fromName+' '+(f.text||'')).toLowerCase())}"><div class="between"><b class="h" style="font-size:15px">${esc(f.userName)}</b><small class="muted">${ago(f.createdAt)}</small></div>
   <small class="muted">${f.sender==='user'?'Customer message':'Agent message'} · forwarded by ${esc(f.fromName)}</small>${fwBody(f)}
   <div class="row" style="gap:8px;justify-content:flex-end">${f.status==='new'?`<button class="mini" data-act="fwDone" data-id="${esc(f.id)}">Done</button>`:'<span class="tagx g">Done</span>'}<button class="mini dk" data-go="chat" data-from="console" data-id="${esc(f.userId)}">Open Chat</button></div></article>`).join(''):'<p class="empty">No forwarded messages</p>'):list.length?list.map(e=>{const o=e.status==='open';return `<article class="card ec" data-k="${esc((e.userName+' '+e.staffName+' '+e.reason).toLowerCase())}">
   <div class="row" style="gap:12px;align-items:flex-start">${av(e.userName,o?'red':'')}<span class="grow" style="min-width:0"><b class="h" style="font-size:15.5px;display:block">${esc(e.userName)}</b><span class="tagx ${o?'r':'g'}">${o?'Escalated':'Resolved'}</span></span><small class="muted" style="white-space:nowrap">${ago(e.createdAt)}</small></div>
   <p>${esc(e.reason)}</p>${e.adminFeedback?`<p class="fb"><b>Your feedback:</b> ${esc(e.adminFeedback)}</p>`:''}
   <div class="between" style="border-top:1px solid var(--line);padding-top:12px"><span class="byl">${I('shield','style="width:14px;height:14px"')}Escalated by ${esc(e.staffName)}</span>
    <span class="row" style="gap:8px">${o?`<button class="mini" data-act="escResolve" data-id="${esc(e.id)}">Resolve</button>`:''}<button class="mini dk" data-go="chat" data-from="console" data-id="${esc(e.userId)}">Join Chat</button></span></div></article>`}).join(''):`<p class="empty">${S.escTab==='open'?'No escalated chats waiting':'Nothing here'}</p>`}</div>
  <button class="b dark" style="height:50px;border-radius:999px;border:1.5px solid #D4A72C;margin-top:18px" data-act="soon">Broadcast Global System Alert</button></div></section>`},

chats:()=>{const wait=S.convos.filter(c=>c.unread),list=S.chatTab==='wait'?wait:S.convos;
 return `<section class="scr">${hd('Chats','Staff and customers','dash',`<span class="badge b-failed xs">${wait.length} NEW</span>`)}
 <div class="bd" style="padding-left:0;padding-right:0"><div style="padding:0 20px">${search('Search customer name or keyword...')}

  try{CALL.stream=await callMedia()}catch(e){CALL.busy=false;callCleanup();return toast(callMediaError(e))}
  try{const pc=await callPC(),off=await pc.createOffer();await pc.setLocalDescription(off);
    const d=await api('POST','/api/call/start',{as:CALL.as,to,video:!!video,sdp:{type:off.type,sdp:off.sdp}});
    CALL.id=d.id;CALL.pending.forEach(callSendIce);CALL.pending=[];callUI('calling');callTone('back');callLoop()}
  catch(e){callCleanup();toast(e.message||'Could not start the call')}
  CALL.busy=false}
function callLoop(){clearInterval(CALL.poll);CALL.poll=setInterval(async()=>{const id=CALL.id;if(!id)return;let d;
  try{d=await api('GET','/api/call/'+id+'?as='+CALL.as+'&since='+CALL.since)}catch(e){return}
  if(CALL.id!==id)return;
  if(d.answer&&CALL.role==='a'&&!CALL.answered){CALL.answered=true;callTone(null);if(CALL.ui!=='active')callUI('connecting');try{await CALL.pc.setRemoteDescription(d.answer)}catch(e){}}
  if(CALL.pc&&CALL.pc.remoteDescription&&d.ice&&d.ice.length){CALL.since+=d.ice.length;for(const c of d.ice){try{await CALL.pc.addIceCandidate(c)}catch(e){}}}
  if(['ended','declined','missed','answered-elsewhere'].includes(d.state))callEnd(d.state==='declined'?'Call declined':d.state==='missed'&&CALL.role==='a'?'No answer':d.state==='answered-elsewhere'?'Answered on another device':CALL.ui==='incoming'?'Missed call':'Call ended',true)},900)}
function callIncoming(c){if(CALL.id||CALL.busy)return;CALL.seen.add(c.id);
  Object.assign(CALL,{id:c.id,role:'b',name:c.name,video:!!c.video,offer:c.offer,since:0,pending:[],answered:false,muted:false,camOff:false,t0:0});
  callUI('incoming');callTone('ring');callLoop()}
async function callAccept(){if(CALL.busy||!CALL.id)return;CALL.busy=true;callTone(null);callUI('connecting');
  try{CALL.stream=await callMedia()}catch(e){CALL.busy=false;toast(callMediaError(e));return callDecline()}
  try{const pc=await callPC();await pc.setRemoteDescription(CALL.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    await api('POST','/api/call/'+CALL.id+'/accept',{as:CALL.as,sdp:{type:ans.type,sdp:ans.sdp}});CALL.pending.forEach(callSendIce);CALL.pending=[]}
  catch(e){toast(e.message||'Could not answer the call');callCleanup()}
  CALL.busy=false}
function callDecline(){if(CALL.id)api('POST','/api/call/'+CALL.id+'/decline',{as:CALL.as}).catch(()=>{});callCleanup()}
function callEnd(msg,remote){if(!remote&&CALL.id)api('POST','/api/call/'+CALL.id+'/end',{as:CALL.as}).catch(()=>{});const had=!!CALL.id;callCleanup();if(had&&msg)toast(msg);
  if(had&&inChat()&&typeof refreshChat==='function')setTimeout(refreshChat,1200)}
function callCleanup(){clearInterval(CALL.poll);clearInterval(CALL.tick);callTone(null);
  if(CALL.stream)CALL.stream.getTracks().forEach(t=>t.stop());if(CALL.pc)try{CALL.pc.close()}catch(e){}
  ['call-remote','call-local'].forEach(i=>{const v=document.getElementById(i);if(v)v.srcObject=null});
  Object.assign(CALL,{id:null,pc:null,stream:null,role:null,offer:null,t0:0,ui:null});const u=document.getElementById('callui');if(u)u.className=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-call]');if(!b)return;e.preventDefault();e.stopPropagation();callStart(b.dataset.call,b.dataset.cname,!!b.dataset.cvideo)},true);
// Look for incoming calls while the app is open (a push alert brings people back to the app when it is closed)
async function callCheck(){if(document.visibilityState!=='visible'||CALL.id||CALL.busy||!callReady())return;
  try{const d=await api('GET','/api/call/incoming?as='+CALL.as);const c=(d.calls||[]).find(x=>!CALL.seen.has(x.id));if(c)callIncoming(c)}catch(e){}}
setInterval(callCheck,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(callCheck,300)});
window.addEventListener('pagehide',()=>{if(CALL.id&&CALL.ui==='active')navigator.sendBeacon&&navigator.sendBeacon('/api/call/'+CALL.id+'/end',new Blob([JSON.stringify({as:CALL.as})],{type:'application/json'}))});
BIO.login='login';BIO.open=['alertGate','loading','login','lock'];
const bioEnter=()=>startApp();
const startApp=()=>refresh().then(()=>{const h=location.hash.slice(1);return gateGo(V[h]&&LIVE.includes(h)?h:'dash')}).catch(()=>go('login'));
if(lsGet(BIO.key)){go('lock');bioUnlock(true)}else startApp();
</script>
