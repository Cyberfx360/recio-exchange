<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D4DC7">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZAPLUG Admin">
<title>AZAPLUG Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Brand tokens (AZAPLUG Brand Guidelines v1.0) ---------- */
:root{
  --blue:#0D4DC7; --blue-dark:#0A3FA6; --slate:#111827; --bg:#F4F7FC;
  --green:#10B981; --orange:#F59E0B; --red:#EF4444;
  --muted:#6B7280; --soft:#9CA3AF; --line:#E3E8F1; --card:#fff;
  --head:'Outfit',system-ui,sans-serif; --body:'Geist','Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --r-card:24px; --r-field:12px; --m:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E6EAF2;font-family:var(--body);color:var(--slate);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:402px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.screen{min-height:100dvh;padding:28px var(--m) 40px;display:flex;flex-direction:column}
.screen.tabs{padding-bottom:130px}
.screen.white{background:#fff}
.screen.blue{background:var(--blue);color:#fff}
h1,h2,h3,.h{font-family:var(--head);letter-spacing:-.01em}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:999px;background:var(--blue);color:#fff;font-family:var(--head);font-weight:700;font-size:17px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985);background:var(--blue-dark)}
.btn.sq{border-radius:16px;height:56px;box-shadow:0 10px 22px -10px rgba(13,77,199,.55)}
.btn.white{background:#fff;color:var(--blue)}
.btn.outline{background:#fff;color:var(--slate);border:1.5px solid #D9DEE8;font-family:var(--body);font-weight:500;font-size:18px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);flex:none}
.icon-btn.sqr{border-radius:12px;color:var(--slate)}
.link{color:var(--blue);font-weight:700}

/* ---------- Fields ---------- */
label.lb{display:block;font-weight:600;font-size:15px;margin:22px 0 10px}
.field{display:flex;align-items:center;gap:10px;height:58px;border:1.5px solid #E1E5EC;border-radius:var(--r-field);background:#fff;padding:0 18px}
.field:focus-within{border-color:var(--blue)}
.field input,.field select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.field input::placeholder{color:#9CA3AF}
.field select{appearance:none;-webkit-appearance:none;font-weight:600}
.field .eye{color:#4B5563}
.field.sm{height:52px}

/* ---------- Cards / badges ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-approved,.b-processing{background:#E4F6EE;color:#0E9F6E}
.b-checking{background:#FEEFC3;color:#E08A00}
.b-confirmed,.b-compensation,.b-draft,.b-live{background:#EAF1FE;color:var(--blue)}
.b-failed{background:#FDE0E0;color:var(--red)}
.cap{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- Top bars ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:44px}
.top .title{font-family:var(--head);font-weight:700;font-size:20px;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.top.left .title{position:static;text-align:left;font-size:24px;margin-left:14px;flex:1}
.brand{font-family:var(--head);font-weight:800;font-size:22px;color:var(--blue);letter-spacing:0}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(min(402px,100vw) - 40px);height:76px;background:var(--blue);border-radius:38px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 14px 30px -10px rgba(13,77,199,.6);z-index:20}
.nav button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.72);font-size:11.5px;font-weight:500;flex:1 1 0;min-width:0}
.nav button.on{color:#fff;font-weight:700}
.nav svg.i{width:23px;height:23px}
.fab{position:fixed;bottom:108px;right:calc(50% - min(201px,50vw) + 22px);width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(13,77,199,.7);z-index:21}
.fab.low{bottom:28px}

/* ---------- Segments ---------- */
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}

/* ---------- Auth ---------- */
.logo-dot{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto}
.logo-dot svg.i{width:40px;height:40px;stroke-width:1.6}
.logo-dot.sm{width:64px;height:64px}.logo-dot.sm svg.i{width:26px;height:26px;stroke-width:2}
.wordmark{font-family:var(--head);font-weight:800;font-size:36px;text-align:center}
.role{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);text-align:left;margin-top:14px;color:#fff}
.role .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.role b{font-family:var(--head);font-size:19px;font-weight:700;display:block}
.role span{font-size:14px;opacity:.8}
.role.on{background:#fff;color:var(--blue);box-shadow:0 12px 26px -10px rgba(0,0,0,.35)}
.role.on .ic{background:#EEF2FB}
.role .chev{margin-left:auto;opacity:.7}
.auth h1{font-size:32px;font-weight:800;line-height:1.15}
.auth .sub{color:#4B5563;font-size:16px;margin-top:10px}
.or{display:flex;align-items:center;gap:20px;color:var(--muted);margin:22px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:#E1E5EC}
.finger{width:180px;height:180px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#F5F7FD;border:1px solid #E1E7F5}
.finger i{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:#E7ECF9;border:1px solid #D2DBF2}
.finger b{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 10px 22px -6px rgba(13,77,199,.6)}
.finger svg.i{width:44px;height:44px;stroke-width:1.5}

/* ---------- Home ---------- */
.balance{background:var(--blue);color:#fff;border-radius:28px;padding:22px 20px 20px;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.balance small{font-size:13px;opacity:.85}
.balance .amt{font-family:var(--head);font-weight:800;font-size:36px;line-height:1.2;margin:4px 0 16px}
.pills{display:flex;gap:8px}
.pills button{flex:1;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;padding:0;min-width:0}
.pills button:first-child{font-size:11px;flex:1.1}
.pills button.on{background:#fff;color:var(--blue);border-color:#fff}
.txn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}
.txn .nm{font-family:var(--head);font-weight:600;font-size:16.5px}
.txn .dt{font-size:12px;color:var(--soft);margin-top:2px}
.txn .rt{margin-left:auto;text-align:right}
.txn .am{font-family:var(--head);font-weight:700;font-size:16.5px;margin-bottom:4px}
.flag{width:40px;height:40px;border-radius:50%;background:#EEF1F6;display:grid;place-items:center;font-size:24px;line-height:1;overflow:hidden;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 4px}
.sec-h h3{font-size:17px;font-weight:600}

/* ---------- Get account ---------- */
.acct .mono{font-family:var(--mono);font-weight:700;font-size:13px;margin-top:12px}
.noimg{height:100px;border-radius:14px;background:#EEF2F8;border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:8px;color:#9AA3B5;font-family:var(--mono);font-size:13px;margin-top:14px}
.noimg svg.i{width:26px;height:26px}
.copy{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--slate);background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:0 2px 0 rgba(17,24,39,.15)}
.kv{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;padding:7px 14px;font-size:13px;border-top:1px solid #EEF1F6}
.kv div:first-child{border-top:0}
.kv b{font-family:var(--mono);font-weight:700}
.kv span{color:var(--muted)}

/* ---------- Summary rows ---------- */
.sum div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.sum span{color:#4B5563}
.sum b{font-family:var(--head);font-weight:700;font-size:17px}
.sum.plain b{font-family:var(--body);font-weight:500;font-size:15px}
.hr,.sum div.hr{height:1px;background:var(--line);margin:8px 0;padding:0}
.ok-ring{width:104px;height:104px;border-radius:50%;background:#E3EAF8;display:grid;place-items:center;margin:8px auto 18px}
.ok-ring i{width:80px;height:80px;border-radius:50%;background:#C9D6F3;display:grid;place-items:center}
.ok-ring b{width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.ok-ring svg.i{width:28px;height:28px}
.upload{display:grid;place-items:center;align-content:center;gap:10px;height:106px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--soft);cursor:pointer;width:100%}
.upload span.c{width:36px;height:36px;border-radius:50%;background:#F1F4F9;border:1px solid var(--line);display:grid;place-items:center;color:#4B5563}

/* ---------- Crypto ---------- */
.toggle2{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.toggle2 button{padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.toggle2 button.on{background:var(--blue);color:#fff}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.coin svg.i{width:18px;height:18px}
.big{font-family:var(--head);font-weight:800;font-size:32px;margin-top:16px}
.qr{width:200px;height:200px;margin:26px auto 18px;position:relative}

/* ---------- Chat ---------- */
.chat{padding:0;background:#E8EEF8;min-height:100dvh;display:flex;flex-direction:column}
.chat-top{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700;position:relative;flex:none}
.avatar:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.msgs{flex:1;padding:18px 16px 110px;display:flex;flex-direction:column;gap:20px}
.day{align-self:center;background:#DDE3EE;color:#6B7280;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.03em}
.msg{max-width:80%;padding:12px 15px 9px;border-radius:18px;font-size:15px;line-height:1.45;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.msg.in{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.msg.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{display:block;color:var(--blue);font-weight:700;font-size:13px;margin-bottom:3px}
.msg time{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:3px}
.voice{display:flex;align-items:center;gap:10px}
.voice .pl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.voice .pl svg.i{width:15px;height:15px;stroke-width:2.5}
.msg.in .pl{background:var(--blue);color:#fff}.msg.out .pl{background:#fff;color:var(--blue)}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;border-radius:2px;background:currentColor;opacity:.9}
.msg.in .wave{color:var(--blue)}
.shot{height:150px;border-radius:14px;background:linear-gradient(135deg,#C6D8DE,#E9F0F3);display:grid;place-items:center;color:#5B6B7A;font-size:12px;margin-bottom:8px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(402px,100vw);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.composer .inp{flex:1;min-width:0;display:flex;align-items:center;height:42px;border-radius:999px;background:#F1F3F7;padding:0 14px;color:#6B7280}
.composer input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.composer .rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#F1F3F7;color:#6B7280;flex:none}
.composer .rb.send{background:var(--blue);color:#fff;box-shadow:0 6px 14px -4px rgba(13,77,199,.6)}

/* ---------- Profile ---------- */
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 16px 30px -14px rgba(13,77,199,.7)}
.hero .ph{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;margin:0 auto 14px;font-family:var(--head);font-weight:700;font-size:30px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.info span{color:var(--muted)}.info b{font-weight:600;text-align:right;word-break:break-word}
.pref{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.pref b{font-family:var(--head);font-weight:600;display:block}.pref small{color:var(--muted);font-size:12.5px}
.sw{width:46px;height:26px;border-radius:999px;background:#D5D9E2;position:relative;transition:.15s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on:after{left:23px}
.menu{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;font-family:var(--head);font-weight:600;font-size:15.5px;text-align:left}
.menu .ic{width:36px;height:36px;border-radius:50%;background:#EEF2FB;color:var(--blue);display:grid;place-items:center}
.menu .chev{margin-left:auto;color:var(--soft)}
.menu.danger{color:var(--red)}.menu.danger .ic{background:#FDE0E0;color:var(--red)}.menu.danger .chev{color:var(--red)}

/* ---------- Notifications / rules / loan ---------- */
.note{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.note.unread{border:1.5px solid var(--blue)}
.note .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.note h4{font-family:var(--head);font-weight:600;font-size:15.5px}
.note p{font-size:13px;color:var(--muted);margin-top:4px}
.note .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:middle}
.rules p{font-weight:500;font-size:14.5px;margin-bottom:18px;line-height:1.35}
.warn{display:flex;gap:14px;align-items:center;background:#FEF9E6;border:1px solid #F8DE8B;border-radius:18px;padding:16px;color:#B45309}
.warn b{font-family:var(--head);display:block}.warn p{font-size:13px}
.tile{border-radius:16px;padding:16px;margin-top:14px}
.banner{display:flex;align-items:center;gap:10px;background:#E6ECF9;color:var(--blue);font-weight:600;border-radius:12px;padding:12px 14px;margin-bottom:22px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:50;max-width:340px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--soft);padding:40px 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.blue :focus-visible{outline-color:#fff}
.btn:disabled{opacity:.7}
a.role{display:flex}

/* ---------- Admin ---------- */
.scr{min-height:100dvh;background:#F7F9FC}
.hd{display:flex;align-items:center;gap:14px;background:#fff;padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.hd h1{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.2}
.hd p{font-size:12.5px;color:#4B5563}
.hd .bk{width:36px;height:36px;border-radius:50%;background:#EAF1FE;color:var(--blue);display:grid;place-items:center;flex:none}
.hd .bk svg{width:17px;height:17px;stroke-width:2.5}
.hd.dark{background:#111827;color:#fff;border:0}.hd.dark p{color:#9CA3AF}.hd.dark .bk{background:rgba(255,255,255,.12);color:#fff}.hd.dark h1{font-size:17px}
.hd.blue{background:linear-gradient(#0D4DC7,#0A3A9E);color:#fff;border:0}.hd.blue p{color:rgba(255,255,255,.8)}.hd.blue .bk{background:rgba(255,255,255,.18);color:#fff}.hd.blue h1{font-size:18px}
.bd{padding:18px 20px 44px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{gap:6px;margin-top:14px}.g4 .sb{font-size:10.5px;height:44px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:block;box-shadow:0 2px 6px rgba(17,24,39,.04);min-width:0}
.stat small{display:block;font-size:13px;color:#4B5563}.stat b{display:block;font-family:var(--head);font-size:24px;font-weight:700;margin:6px 0 4px;line-height:1.2}.stat i{font-style:normal;font-size:12px;color:#4B5563}
.stat.sm{padding:10px 12px;border-radius:12px}.stat.sm small{font-size:11px}.stat.sm b{font-size:17px;margin:3px 0 2px}.stat.sm i{font-size:10.5px;color:var(--soft)}
.sh{font-family:var(--head);font-size:16px;font-weight:600;margin:22px 0 12px}
.qa{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:13.5px;box-shadow:0 2px 6px rgba(17,24,39,.04)}
.qa span{width:42px;height:42px;border-radius:50%;background:#EEF3FE;color:var(--blue);display:grid;place-items:center}
.feed{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.feed>i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.feed b{display:block;font-size:14px;font-weight:600}.feed small{font-size:12px;color:#4B5563}.feed em{font-style:normal;font-weight:700;color:var(--blue);font-size:14px;white-space:nowrap}
.write{display:flex;gap:6px;align-items:center;background:#EAF1FE;border:1px solid #BFD3F8;color:var(--blue);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px}

const n0=n=>Number(n||0).toLocaleString('en-NG'), naira=n=>'₦'+n0(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=s=>/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+$/i.test(s||'')?s:'';

const ini=n=>(String(n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('')||'?').toUpperCase();
const fd=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const ft=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fdt=d=>fd(d)+' • '+ft(d);
const today=d=>new Date(d).toDateString()===new Date().toDateString();
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+' mins ago';if(s<86400)return Math.floor(s/3600)+' hours ago';if(s<172800)return 'Yesterday';return fd(d)};
const tid=t=>'#'+String(t.id).slice(0,4).toUpperCase();
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&S.route!=='login'){go('login')}
  if(!r.ok)throw new Error(d.error||'Something went wrong. Try again.');
  return d;
}
async function refresh(){
  const [u,s,a,t,w,st,c]=await Promise.all(['users','staff','accounts','trades','withdrawals','settings','chats'].map(x=>api('GET','/api/admin/'+x)));
  S.users=u.users||[];S.staff=s.staff||[];S.accounts=a.accounts||[];S.trades=t.trades||[];S.wds=w.withdrawals||[];S.settings=st||{};S.convos=c.conversations||[];
  try{const e=await api('GET','/api/admin/escalations');S.escs=e.escalations||[];S.escErr=''}catch(err){S.escs=[];S.escErr=err.message}
  try{const l=await api('GET','/api/admin/loans');S.loans=l.loans||[];S.loanLimit=l.limit;S.loanErr=''}catch(err){S.loans=[];S.loanErr=err.message}
}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=e=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const c=document.createElement('canvas'),k=Math.min(1,1000/img.width);c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};img.src=e.target.result};fr.readAsDataURL(file)})}

function pick(title,opts){return new Promise(res=>{askResolve=res;

    <span class="grow" style="min-width:0"><b class="h" style="font-size:16px">${n0(t.intendedAmount)}</b><small class="d">${esc(t.accountTitleUsed||'Account')} • ${esc(t.userName)}</small><small class="d">${fdt(t.createdAt)}</small></span><span class="badge ${b[1]} xs">${b[0]}</span></button>

   ${t.status==='approved'&&t.creditedAmount==null?`<button class="b green" style="margin-top:10px" data-go="trade" data-id="${esc(t.id)}">Verify and Credit Balance</button>`:''}</article>`}).join(''):'<p class="empty">No receipts waiting</p>'}</div></section>`},

trade:()=>{const t=S.trades.find(x=>x.id===S.id);if(!t)return V.receipts();const img=safeImg(t.receiptImage),b=tBadge(t),fi=safeImg(t.failImage),canCredit=t.status==='approved'&&t.creditedAmount==null;
 const row=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
 return `<section class="scr">${hd('Trade '+tid(t),'Full Review &amp; Admin Controls',S.back==='user'?'user':'receipts')}
 <div class="bd"><div class="card row" style="gap:12px;padding:14px">${av(t.userName)}<span class="grow" style="min-width:0"><b class="h" style="font-size:15px;display:block">${esc(t.userName)}</b><small class="muted">${esc(t.userPhone)}</small></span><span class="badge ${b[1]} xs">${b[0]}</span></div>
  <div class="card" style="margin-top:14px;padding:12px"><div class="cl" style="margin-top:2px">User uploaded receipt</div>
   ${img?`<img src="${img}" alt="Receipt uploaded by the customer" style="width:100%;max-height:460px;object-fit:contain;background:#EEF2F8;border-radius:10px;display:block"><button class="b soft" style="margin-top:10px" data-act="savePic" data-kind="receipt" data-id="${esc(t.id)}">${I('dl','style="width:16px;height:16px"')}Save to Device</button>`:'<div class="noimg" style="margin-top:0">No receipt image</div>'}</div>
  <div class="card tp" style="margin-top:14px"><b style="font-size:14px">Trade Parameters</b>

   ${row('User account',esc([t.userPayoutBank,t.userPayoutAccount].filter(Boolean).join(' • ')||'—'))}${row('Staff Handled','Staff: '+esc(t.staffName))}${row('Date &amp; Time',fdt(t.createdAt))}
   ${t.lowestRate!=null?row('Account rates',`${n0(t.lowestAmount)} → ${naira(t.lowestRate)}<br>${n0(t.higherAmount)} → ${naira(t.higherRate)}`):''}
   ${t.staffCreditedAmount!=null?row('Staff proposed',naira(t.staffCreditedAmount)):''}${t.creditedAmount!=null?row('Credited to balance',`<span style="color:#0E9F6E">${naira(t.creditedAmount)}</span>`):''}
   ${t.failReason?row('Failure reason',`<span style="color:var(--red)">${esc(t.failReason)}</span>`):''}</div>
  ${fi?`<img src="${fi}" alt="Failure proof" style="width:100%;border-radius:12px;margin-top:12px"><button class="b soft" data-act="savePic" data-kind="fail" data-id="${esc(t.id)}">${I('dl','style="width:16px;height:16px"')}Save to Device</button>`:''}
  ${canCredit?`<div class="card" style="margin-top:14px;border-color:#A7E3CB"><label class="cl" style="margin-top:0" for="t-credit">Final amount to credit (₦)</label><input class="in" id="t-credit" inputmode="decimal" placeholder="e.g. 450000" value="${t.staffCreditedAmount!=null?esc(t.staffCreditedAmount):''}"><button class="b green" data-act="tradeCredit" data-id="${esc(t.id)}">Verify and Credit Balance</button></div>`:''}
  <label for="t-reason" style="display:block;font-weight:600;font-size:13.5px;margin:18px 0 8px">Failure Reason/ Compensation Reason (Mandatory if Undoing/Failing)</label>
  <textarea class="in" id="t-reason" rows="2" placeholder="Enter reason (e.g., Receipt amount mismatch, Unconfirmed credit)..."></textarea>
  <div class="row g4"><button class="sb s-red" data-act="tradeMark" data-status="failed" data-id="${esc(t.id)}">Undo to Failed</button><button class="sb green" data-act="tradeMark" data-status="approved" data-id="${esc(t.id)}">Approve Trade</button><button class="sb orange" data-act="tradeMark" data-status="confirmed" data-id="${esc(t.id)}">Confirmed</button><button class="sb blue" data-act="soon">Compensation</button></div></div></section>`},

   <span class="between" style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><span class="row muted" style="gap:6px;font-size:13px">${I('cardi','style="width:14px;height:14px"')}${esc(w.payoutBank)}</span><b class="h" style="font-size:16px">${naira(w.amount)}</b></span></button>`}).join(''):'<p class="empty">Nothing here</p>'}

  let rec;try{rec=new MediaRecorder(stream,{mimeType:type,audioBitsPerSecond:32000})}catch(e){stream.getTracks().forEach(t=>t.stop());return toast('Voice notes are not supported on this browser')}
  Object.assign(VN,{rec,stream,type,chunks:[],levels:[],cancel:false,t0:Date.now(),an:null,ctx:null});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)VN.chunks.push(e.data)};rec.onstop=recDone;
  try{const AC=window.AudioContext||window.webkitAudioContext;VN.ctx=new AC();VN.an=VN.ctx.createAnalyser();VN.an.fftSize=256;VN.ctx.createMediaStreamSource(stream).connect(VN.an);VN.buf=new Uint8Array(VN.an.fftSize)}catch(e){VN.an=null}
  rec.start();c.classList.add('rec');
  c.insertAdjacentHTML('beforeend',`<div class="recbar"><button type="button" class="rb del" data-vn="recCancel" aria-label="Delete recording">${I('trash')}</button><span class="recmid" role="status" aria-label="Recording voice note"><i class="dot"></i><b id="rec-t">0:00</b><span class="wave" id="rec-w"></span></span><button type="button" class="rb send" data-vn="recSend" aria-label="Send voice note">${I('send')}</button></div>`);
  VN.timer=setInterval(recTick,100)}
function recTick(){const s=(Date.now()-VN.t0)/1000;let lv=0;
  if(VN.an){VN.an.getByteTimeDomainData(VN.buf);let p=0;for(let k=0;k<VN.buf.length;k++)p=Math.max(p,Math.abs(VN.buf[k]-128));lv=Math.min(1,p/80)}
  VN.levels.push(lv);const t=$('#rec-t'),w=$('#rec-w');if(t)t.textContent=mmss(s);
  if(w)w.innerHTML=VN.levels.slice(-34).map(l=>`<i style="height:${3+l*20}px"></i>`).join('');
  if(s>=VN.MAX){toast('Voice notes can be up to 2 minutes');recEnd(false)}}
function recEnd(cancel){if(!VN.rec)return;VN.cancel=cancel;VN.secs=(Date.now()-VN.t0)/1000;clearInterval(VN.timer);const rec=VN.rec;
  try{if(rec.state!=='inactive')rec.stop();else recDone()}catch(e){recDone()}}
async function recDone(){if(!VN.rec)return;const {chunks,type,secs,levels,cancel,stream,ctx}=VN;VN.rec=null;
  stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close().catch(()=>{});
  const c=$('.composer');if(c){c.classList.remove('rec');const b=c.querySelector('.recbar');if(b)b.remove()}
  if(cancel)return;if(secs<1)return toast('That was too short. Record a little longer');
  const blob=new Blob(chunks,{type});if(!blob.size)return toast('Nothing was recorded. Try again');
  const n=32,w=[];for(let i=0;i<n;i++){const a=Math.floor(i*levels.length/n),b=Math.max(a+1,Math.floor((i+1)*levels.length/n));w.push(Math.max(0,...levels.slice(a,b)))}
  const top=Math.max(...w);for(let i=0;i<n;i++)w[i]=top>.02?Math.max(1,Math.round(w[i]/top*9)):0; // bars are relative to the loudest moment, so quiet voices still show a shape
  try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(blob)});
    const imageData=`data:${type.replace(/\s/g,'')};dur=${Math.max(1,Math.round(secs))}${w.some(x=>x>0)?';w='+w.join(''):''};base64,${b64}`;
    const d=await api('POST',VN_URL(),{imageData});S.chat.push(d.message);const box=$('#msgs');if(box&&S.route==='chat'){box.innerHTML=msgsHtml();chatBottom()}}
  catch(e){toast(e.message||'Could not send the voice note')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-vn]');if(!b)return;const k=b.dataset.vn;
  if(k==='recStart')recStart();else if(k==='recCancel')recEnd(true);else if(k==='recSend')recEnd(false);
  else{const el=b.closest('.voice');if(!el)return;if(k==='seek'){const r=b.getBoundingClientRect();vnPlay(el.dataset.vnid,Math.min(.98,Math.max(0,(e.clientX-r.left)/r.width)))}else vnPlay(el.dataset.vnid)}});
// The send arrow shows while there is text; the microphone shows when the box is empty.
const vnSync=()=>{const i=$('#c-in');if(i)i.closest('.composer').classList.toggle('typing',!!i.value.trim())};
document.addEventListener('input',e=>{if(e.target.id==='c-in')vnSync()});
document.addEventListener('submit',()=>setTimeout(vnSync,0),true);
let poll=null;
const typing=()=>document.activeElement&&document.activeElement.matches('input,textarea');
function render(){$('#app').innerHTML=V[S.route]();if(S.route==='chat')chatBottom()}
function go(r,o,pop){
  if(S.route!==r)$('#toast').classList.remove('show');
  if(r!=='chat'){recEnd(true);vnStop()}
  Object.assign(S,o||{});S.route=r;if(r==='wds')S.wdPage=S.wdPage||1;
  if(!pop)navPush(r);
  render();if(r!=='chat')window.scrollTo(0,0);
  clearInterval(poll);poll=null;
  if(r==='login'||r==='loading')return;
  if(r==='chat'){S.chat=[];const pull=()=>api('GET','/api/admin/chats/'+encodeURIComponent(S.id)).then(d=>{const n=(d.messages||[]).length!==S.chat.length;S.chat=d.messages||[];
      if(n&&S.route==='chat'){$('#msgs').innerHTML=msgsHtml();chatBottom()}}).catch(()=>{});pull();poll=setInterval(pull,5000);return}
  if(['dash','staff','receipts','wds','users','chats','accountsAll','rates','console','loans'].includes(r))refresh().then(()=>{if(S.route===r&&!typing())render()}).catch(()=>{});
}
async function reload(r,o){await refresh();go(r||S.route,o)}

/* ---------- Actions ---------- */
const ACT={
  soon(){toast('Coming soon')},
  show(el){const i=$('#lg-pw'),sh=i.type==='password';i.type=sh?'text':'password';el.textContent=sh?'HIDE':'SHOW'},
  async logout(){try{await pushDetach()}catch(e){}try{await api('POST','/api/admin/logout')}catch(e){}go('login')},
  async alertsOn(){try{await pushOn();toast('Alerts turned on')}catch(e){toast(e.message||'Could not turn on alerts')}render()},
  savePic(el,id){const k=el.dataset.kind,t=S.trades.find(x=>x.id===id)||{};savePic(k==='chat'?(S.chat.find(m=>m.id===id)||{}).imageData:k==='fail'?t.failImage:t.receiptImage,k==='chat'?'azaplug-chat-photo':'azaplug-receipt-'+String(id).slice(0,8))},
  async acctAssign(el,id){const a=S.accounts.find(x=>x.id===id),r=await pick('Assign '+a.title+' ('+a.bankName+') to',[{id:'',label:'No one (admin account)',on:!a.staffId}].concat(S.staff.filter(x=>x.status==='approved').map(x=>({id:x.id,label:x.name,on:a.staffId===x.id}))));
    if(!r||(r.id||null)===(a.staffId||null))return;await api('PUT','/api/admin/accounts/'+id,{staffId:r.id||null});toast(r.id?'Account assigned':'Account un-assigned');await reload()},
  async loanDecide(el,id){const l=S.loans.find(x=>x.id===id),yes=el.dataset.d==='approve';
    if(!await ask(yes?'Approve this loan?':'Decline this loan?',yes?`${naira(l.amount)} will be added to ${l.userName}'s balance now, and taken back from their next credited receipts.`:`${l.userName} will be told their request was not approved.`,yes?'Approve and pay '+naira(l.amount):'Decline',!yes))return;
    await api('POST',`/api/admin/loans/${id}/decide`,{decision:yes?'approve':'decline'});toast(yes?'Loan approved and paid into balance':'Loan declined');await reload()},
  async staffApprove(el,id){await api('PUT',`/api/admin/staff/${id}/approve`);toast('Staff approved');await reload()},
  async staffReject(el,id){const s=S.staff.find(x=>x.id===id);if(!await ask(s.status==='approved'?'Suspend this agent?':'Reject this staff?',`${s.name} will not be able to use the Staff portal.`,s.status==='approved'?'Suspend':'Reject',1))return;
    await api('PUT',`/api/admin/staff/${id}/reject`);toast('Staff access turned off');await reload()},
  async staffDelete(el,id){const s=S.staff.find(x=>x.id===id);if(!await ask('Delete this staff account?',`${s.name} will be removed permanently. Their accounts and receipts stay, and move to you (admin). This cannot be undone.`,'Delete permanently',1))return;
    await api('DELETE',`/api/admin/staff/${id}`);toast('Staff deleted');await reload('staff')},
  userEdit(el,id){go('userEdit',{id,back:S.route==='user'?'user':'users'})},
  async userSuspend(el,id){const u=S.users.find(x=>x.id===id);if(!await ask('Suspend this user?',`${u.name} will be locked out until you approve them again.`,'Suspend',1))return;
    await api('PUT',`/api/admin/users/${id}/reject`);toast('User suspended');await reload()},
  async userApprove(el,id){await api('PUT',`/api/admin/users/${id}/approve`);toast('User approved');await reload()},
  async userDelete(el,id){const u=S.users.find(x=>x.id===id);if(!await ask('Delete this user?',`${u.name} will be removed permanently, together with their receipts, withdrawals, chat and loans.${u.balance>0?' They still have '+naira(u.balance)+' in their balance.':''} This cannot be undone.`,'Delete permanently',1))return;
    await api('DELETE',`/api/admin/users/${id}`);toast('User deleted');await reload('users')},
  acctEdit(el,id){const a=S.accounts.find(x=>x.id===id);go('accountEdit',{form:{...a},back:el.dataset.from||'accountsAll'})},
  async acctVerify(el,id){await api('PUT',`/api/admin/accounts/${id}`,{active:true});toast('Account verified. Customers can now see it.');await reload()},
  async acctDelete(el,id){const a=S.accounts.find(x=>x.id===id);if(!await ask('Delete this account?',`${a.title} (${a.bankName}) will be removed permanently. Receipts already sent to it are kept. This cannot be undone.`,'Delete permanently',1))return;
    await api('DELETE',`/api/admin/accounts/${id}`);toast('Account deleted');await reload()},
  async tradeMark(el,id){const status=el.dataset.status,t=S.trades.find(x=>x.id===id),body={status};
    if(status==='failed'){const r=($('#t-reason')||{}).value;if(!r||!r.trim()){toast('Enter the failure reason first');$('#t-reason')&&$('#t-reason').focus();return}
      body.reason=r.trim();if(!await ask('Mark this trade as failed?',t.creditedAmount!=null?`${naira(t.creditedAmount)} already credited will be taken back from ${t.userName}'s balance.`:`${t.userName} will see the reason you entered.`,'Mark as failed',1))return}
    await api('POST',`/api/admin/trades/${id}/mark`,body);toast('Trade marked '+status);await reload()},
  async tradeCredit(el,id){const amount=num($('#t-credit').value),t=S.trades.find(x=>x.id===id);if(!amount){toast('Enter the final amount to credit');$('#t-credit').focus();return}
    if(!await ask('Credit this balance?',`${naira(amount)} will be added to ${t.userName}'s balance.`,'Credit '+naira(amount)))return;
    await api('POST',`/api/admin/trades/${id}/credit`,{creditedAmount:amount});toast('Balance credited');await reload()},
  async escResolve(el,id){const e=S.escs.find(x=>x.id===id),fb=await askText('Resolve this escalation?',`Your feedback is sent back to ${e.staffName}, who escalated ${e.userName}'s chat.`,'Feedback for staff (e.g. Refund processed. You may continue follow-up.)','Mark as resolved');if(fb===null)return;
    await api('POST',`/api/admin/escalations/${id}/resolve`,{feedback:fb});toast('Escalation resolved');await reload()},
  async wdPaid(el,id){const w=S.wds.find(x=>x.id===id);if(!await ask('Mark as paid?',`Confirm you have sent ${naira(w.amount)} to ${w.userName} (${w.payoutBank}, ${w.payoutAccount}). This cannot be undone.`,'Mark as paid'))return;
    await api('POST',`/api/admin/withdrawals/${id}/mark`,{status:'paid'});await refresh();go('wdDone',{done:S.wds.find(x=>x.id===id)||w})},
  async wdCancel(el,id){const r=$('#w-reason').value.trim(),w=S.wds.find(x=>x.id===id);if(!r){toast('Enter the reason for cancellation');$('#w-reason').focus();return}
    if(!await ask('Cancel this request?',`${naira(w.amount)} will be returned to ${w.userName}'s balance.`,'Cancel request',1))return;
    await api('POST',`/api/admin/withdrawals/${id}/mark`,{status:'rejected',reason:r});toast('Request cancelled and refunded');await reload('wds')}
};
let busy=false;
document.addEventListener('click',async e=>{
  const k=e.target.closest('[data-ask]');if(k){const tx=$('#ask-t'),okv=tx?tx.value.trim():true;$('#sheet').innerHTML='';askResolve&&askResolve(k.dataset.ask==='1'?okv:(tx?null:false));askResolve=null;return}
  if(e.target.classList.contains('sheet-bg')){$('#sheet').innerHTML='';askResolve&&askResolve(false);askResolve=null;return}
  const c=e.target.closest('[data-copy]');if(c){navigator.clipboard?.writeText(c.dataset.copy).then(()=>toast('Copied'),()=>toast('Could not copy'));return}
  const a=e.target.closest('[data-act]');if(a){if(busy)return;busy=true;try{await ACT[a.dataset.act](a,a.dataset.id)}catch(err){toast(err.message||'Something went wrong. Try again.')}finally{busy=false}return}
  const s=e.target.closest('[data-set]');if(s){const[key,v]=s.dataset.set.split(':');S[key]=key==='wdPage'?Number(v):v;if(key==='wdTab')S.wdPage=1;return render()}
  const pk=e.target.closest('[data-pick]');if(pk){$('#sheet').innerHTML='';askResolve&&askResolve({id:pk.dataset.pick});askResolve=null;return}
  const g=e.target.closest('[data-go]');if(g){if(g.matches('.bk,[aria-label="Back"]')&&goBack(g.dataset.go))return;let r=g.dataset.go;const o={};
    if(g.dataset.id){if(r==='user')o.uid=g.dataset.id;else o.id=g.dataset.id}
    if(g.dataset.from)o.back=g.dataset.from;else if(r==='trade'||r==='chat')o.back='';
    if(r==='rates')o.ratesTab='rates';if(r==='rules'){r='rates';o.ratesTab='rules'}
    if(r==='accounts')o.form=null;
    return go(r,o)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){const q=e.target.value.toLowerCase();document.querySelectorAll('#list [data-k]').forEach(el=>el.style.display=el.dataset.k.includes(q)?'':'none')}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='f-img'&&t.files[0]){try{S.form.imageData=await compress(t.files[0]);$('#f-drop').firstChild.remove();$('#f-drop').insertAdjacentHTML('afterbegin',`<img src="${S.form.imageData}" alt="Account image" style="max-height:140px;max-width:100%;border-radius:8px">`);const sp=$('#f-drop span');sp&&sp.remove()}catch(err){toast('Could not read that image')}}
  if(t.id==='c-file'&&t.files[0]){try{const imageData=await compress(t.files[0]);const d=await api('POST','/api/admin/chats/'+encodeURIComponent(S.id)+'/send',{imageData});S.chat.push(d.message);$('#msgs').innerHTML=msgsHtml();chatBottom()}catch(err){toast(err.message||'Could not send photo')}t.value=''}
});
const val=id=>$('#'+id).value.trim();
const FORMS={
  async announce(){const title=val('an-t'),body=val('an-b');if(!title||!body)throw new Error('Enter a title and a message');
    if(!await ask('Send to every customer?',`"${title}" will go to all ${S.users.length} customers and cannot be taken back.`,'Send announcement'))return;
    await api('POST','/api/admin/announce',{title,body});toast('Announcement sent');go('dash')},
  async loanLimit(){const limit=num(val('ln-lim'));await api('PUT','/api/admin/loans/limit',{limit});toast('Loan limit saved');await refresh()},
  async login(){const password=$('#lg-pw').value;if(!password)throw new Error('Enter the admin password');await api('POST','/api/admin/login',{password});await refresh();pushState().then(()=>{if(S.route==='dash')render()});go('dash')},
  async account(){const b={title:val('f-title'),bankName:val('f-bank'),accountNumber:val('f-num'),lowestAmount:num(val('f-la')),lowestRate:num(val('f-lr')),higherAmount:num(val('f-ha')),higherRate:num(val('f-hr')),minAmount:num(val('f-min')),maxAmount:num(val('f-max')),imageData:S.form.imageData||null};
    if(!b.title||!b.bankName||!b.accountNumber)throw new Error('Country, bank name and account number are required');
    if(S.form.id){await api('PUT','/api/admin/accounts/'+S.form.id,b);toast('Account saved');const back=S.back;S.form=null;await reload(back)}
    else{const d=await api('POST','/api/admin/accounts',b);S.form=null;await refresh();go('accountAdded',{done:d.account||b})}},
  async userEdit(){const b={name:val('u-n'),bankName:val('u-b'),accountNumber:val('u-a')};if(Object.values(b).some(v=>!v))throw new Error('All fields are required');
    await api('PUT','/api/admin/users/'+S.id,b);toast('User saved');await reload(S.back)},
  async cryptoRates(){await api('PUT','/api/admin/settings',{btcRate:num(val('cr-btc'))||0,usdtRate:num(val('cr-usdt'))||0});toast('Crypto rates saved');await refresh()},
  async rules(){await api('PUT','/api/admin/settings',{rulesText:$('#r-text').value,maxDeposit:num(val('r-max'))});toast('Rules saved');await refresh()},
  async chat(){const i=$('#c-in'),text=i.value.trim();if(!text)return;i.value='';const d=await api('POST','/api/admin/chats/'+encodeURIComponent(S.id)+'/send',{text});S.chat.push(d.message);$('#msgs').innerHTML=msgsHtml();chatBottom();i.focus()}
};
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,fn=FORMS[f.dataset.form];if(!fn||f.dataset.busy)return;
  f.dataset.busy=1;const b=f.querySelector('.btn,.b');const label=b&&b.innerHTML;if(b){b.disabled=true;b.textContent='Please wait…'}
  try{await fn()}catch(err){toast(err.message||'Something went wrong. Try again.')}
  finally{delete f.dataset.busy;if(b&&b.isConnected){b.disabled=false;b.innerHTML=label}}
});
render();
refresh().then(()=>{pushState().then(()=>{if(S.route==='dash')render()});const h=location.hash.slice(1);go(V[h]&&LIVE.includes(h)?h:'dash')}).catch(()=>go('login'));
</script>
